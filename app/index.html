function segnaChi(cid, chi) { if (!WEB) return; wSet("cartechi/" + cid, { chi: chi || null, at: Date.now(), da: ME() }, { quiet: true }).catch(() => {}); }
const allineati = new Set();
function allineaChi() {
  if (!WEB || !isCouncil() || !S.loaded.cartechi || !S.loaded.cartemov) return;
  for (const c of Object.values(S.carte)) {
    if (allineati.has(c.id)) continue; allineati.add(c.id);
    const h = (detentore(c.id) || {}).chi || null, x = S.cartechi[c.id];
    if ((x ? x.chi || null : null) !== h && (h || x)) segnaChi(c.id, h);

}
function detentore(cid) { let best = null; for (const m of Object.values(S.cartemov)) if (m.tipo === "passaggio" && m.carta === cid && (!best || (m.at || 0) > (best.at || 0))) best = m; return best ? { chi: best.chi || null, at: best.at } : null; }
const speseCarte = () => Object.values(S.cartemov).filter((m) => m.tipo === "spesa");
function saldoCarta(cid) {
  const ric = Object.values(S.carteric).filter((r) => r.tipo === "ricarica" && r.carta === cid).reduce((s, r) => s + (Number(r.importo) || 0), 0);
  return ric - speseCarte().filter((m) => m.carta === cid).reduce((s, m) => s + (Number(m.importo) || 0), 0);
}
/* soldi sulle prepagate divisi per budget: caricati, spesi, rimasti */
function cassaCarte() {
  const pre = new Set(Object.values(S.carte).filter((c) => c.tipo === "prepagata").map((c) => c.id));
  const per = {}; budgetVoci().forEach(([k]) => { per[k] = { caricato: 0, speso: 0 }; });
  let libero = 0;
  for (const r of Object.values(S.carteric)) {
    if (r.tipo === "ricarica" && !pre.has(r.carta)) continue;
    let tot = 0;
    for (const [k, v] of Object.entries(r.alloc || {})) { const n = Number(v) || 0; (per[k] = per[k] || { caricato: 0, speso: 0 }).caricato += n; tot += n; }
    libero += r.tipo === "ricarica" ? (Number(r.importo) || 0) - tot : -tot;
  }
  for (const m of speseCarte()) { if (!pre.has(m.carta)) continue; if (m.budget && per[m.budget]) per[m.budget].speso += Number(m.importo) || 0; else libero -= Number(m.importo) || 0; }
  const totale = [...pre].reduce((s, c) => s + saldoCarta(c), 0);
  return { per, libero: Math.round(libero * 100) / 100, totale, n: pre.size, vis: [...pre].filter((c) => !S.carte[c].eliminata).length };
}
const residuo = (k) => { const x = cassaCarte().per[k]; return x ? x.caricato - x.speso : 0; };

  for (const [pid, c] of entries) { const p = P(pid); if (!p) continue; if (p.track === "none") { for (const u of p.uses || []) if (u.pid && P(u.pid)) take(u.pid, c.i * (Number(u.n) || 1), { expiredFirst: true }); } else take(pid, c.i, { expiredFirst: true }); }

async function leggiPdf(o, v) {

  for (let i = 0; i < parti; i++) { const d = await S.db.doc(`${ORGANI[o].coll}/${v.id}/pdf/${i}`).get(); if (!d.exists) throw new Error("pezzo mancante " + i); b64 += (d.data() || {}).d || ""; }

async function paginePdf(o, v) {

  if (file.size > 9e6) return fErr(f, "Il PDF è troppo grande (massimo 9 MB): comprimilo e riprova.");
  const numero = parseInt(fv(f, "numero"), 10) || null, data = fv(f, "data");

    go(`${ORGANI[o].r}-${id}`);
  } catch (e) { console.warn(e); if (btn) { btn.disabled = false; btn.textContent = "Carica"; } fErr(f, "Non sono riuscito a caricarlo. Controlla la connessione e riprova."); }
};

/* ---------- confronto con il Drive condiviso (solo sito) ---------- */
const DRV = "https://www.googleapis.com/drive/v3/";
function spiegaDrive(e) {
  const m = (e && e.message) || "";
  if (e && e.code === "needs_token") return "Collega Google per usare il Drive.";
  if (/has not been used|is disabled|accessNotConfigured/i.test(m)) return "L'API di Google Drive non è abilitata nel progetto Google Cloud: abilitala (come avete fatto per Calendar) e riprova.";
  if (/not ?found|File not found/i.test(m)) return "Non trovo la cartella dei verbali sul Drive: hai accesso al Drive condiviso?";
  if (/insufficient|permission/i.test(m)) return "Il tuo account non può scrivere nella cartella dei verbali sul Drive condiviso.";
  return "Il Drive ha risposto con un errore: " + (m || "sconosciuto") + ".";
}
async function driveElenco(o) {
  const q = encodeURIComponent(`'${cartellaVerbali(o)}' in parents and trashed=false and mimeType='application/pdf'`);
  const r = await gapi(`${DRV}files?q=${q}&fields=files(id,name,size,modifiedTime)&pageSize=500&supportsAllDrives=true&includeItemsFromAllDrives=true`, {}, SCOPI.drive);
  return (r.files || []).map((f) => ({ ...f, ...infoDaNome(f.name) }));
}
async function driveScarica(id) {

/* ================= STRUMENTI E BARRA IN BASSO: ognuno li sistema come gli servono ================= */
const SEZIONI = { calendario: { h: "calendario", l: "Calendario", i: "cal" }, strumenti: { h: "strumenti", l: "Strumenti", i: "tools" }, gruppi: { h: "gruppi", l: "Gruppi", i: "people" }, mison: { h: "mison", l: "Mi son", i: "user" } };
const MAX_BARRA = 4; // più la Home, sempre prima
/* categorie degli strumenti: aiutano a trovare subito quello che serve */
const CATEGORIE = [
  ["serate", "Serate e magazzino", ["cassa", "magazzino", "ordini", "allestimenti"]],
  ["soldi", "Soldi", ["finanze", "budget", "carte", "rimborsi", "pagamenti", "sponsor"]],
  ["soci", "Soci e comunicazione", ["soci", "compiti", "opencall", "editoriale"]],
  ["documenti", "Documenti e scadenze", ["verbali", "scadenze", "posta"]],
];
const ORDINE_BASE = CATEGORIE.flatMap(([, , hs]) => hs);
function perCategoria(lista) {
  const out = [], dove = {};
  for (const t of lista) {
    const c = CATEGORIE.find(([, , hs]) => hs.includes(t.h)) || ["altro", "Altro", []];
    if (!(c[0] in dove)) { dove[c[0]] = out.length; out.push({ k: c[0], l: c[1], items: [] }); }
    out[dove[c[0]]].items.push(t);
  }
  return out;
}
/* griglia degli strumenti: divisa per categoria quando sono più di 4 */
function grigliaStrumenti(lista, piccolo) {
  const cats = perCategoria(lista);
  if (lista.length <= 4 || cats.length < 2) return `<div class="tools ${piccolo ? "mini" : ""}">${lista.map((t) => tileStr(t, piccolo)).join("")}</div>`;
  return `<div class="toolcats">${cats.map((c) => `<section class="toolcat" aria-label="${esc(c.l)}"><h4>${esc(c.l)}</h4><div class="tools ${piccolo ? "mini" : ""}">${c.items.map((t) => tileStr(t, piccolo)).join("")}</div></section>`).join("")}</div>`;
}
const prefStr = () => S.prefs.strumenti || {};
/* gli strumenti nell'ordine scelto; quelli nuovi vanno in fondo */
function strumentiOrdinati() {
  const tutti = strumenti(), ord = prefStr().ordine || [];
  const base = (h) => { const i = ORDINE_BASE.indexOf(h); return i < 0 ? 500 + tutti.findIndex((t) => t.h === h) : i; };
  const pos = (h) => { const i = ord.indexOf(h); return i < 0 ? 999 + base(h) : i; };
  return tutti.slice().sort((a, b) => pos(a.h) - pos(b.h));
}
const nascosto = (h) => (prefStr().nascosti || []).includes(h);
const mieiStrumenti = () => strumentiOrdinati().filter((t) => !nascosto(t.h));
function barraBase() { return strumenti().length ? ["calendario", "strumenti", "gruppi", "mison"] : ["calendario", "gruppi", "mison"]; }
/* cosa c'è nella barra: sezioni o strumenti scelti, solo se ancora disponibili */
function vociBarra() {
  const tools = strumenti(), scelta = prefStr().barra;
  const voce = (h) => SEZIONI[h] ? (h === "strumenti" && !tools.length ? null : SEZIONI[h]) : tools.find((t) => t.h === h) || null;
  let v = (Array.isArray(scelta) && scelta.length ? scelta : barraBase()).map(voce).filter(Boolean).slice(0, MAX_BARRA);
  if (!v.length) v = barraBase().map(voce).filter(Boolean);
  return [{ h: "home", l: "Home", i: "home" }, ...v];
}
const inBarra = (h) => vociBarra().some((x) => x.h === h);
function tileStr(t, piccolo) { return `<a class="tool ${piccolo ? "mini" : ""}" href="#${t.h}">${ic(t.i)}<span><b>${esc(t.l)}</b>${piccolo ? "" : `<small>${esc(t.s)}</small>`}</span>${t.n ? `<span class="badge" ${t.nt ? `title="${esc(t.n + " " + t.nt)}" aria-label="${esc(t.n + " " + t.nt)}"` : ""}>${t.n}</span>` : ""}</a>`; }

/* ================= NOTIFICHE SUL TELEFONO (solo sito) =================
   L'app lascia un messaggio in «notifiche»; lo script Google del consiglio (apps-script/Codice.gs)
   ogni minuto lo manda con Firebase Cloud Messaging ai telefoni di chi lo deve ricevere.
   Ognuno registra i suoi telefoni in «pushtoken/<id>» e lì sceglie quali notifiche vuole. */
const TIPI_NOTIFICA = [
  ["eventi", "Nuovi eventi e appuntamenti", "anche quando vengono annullati"],
  ["promemoria", "Promemoria il giorno prima", "per quelli a cui hai detto «ci sono» e per le assemblee"],
  ["ruolo", "Per il tuo ruolo", ""],
  ["soldi", "I tuoi rimborsi", "quando il tuo rimborso è approvato, pagato o rifiutato"],
  ["lavoro", "Cose da fare", "compiti affidati a te, post da pubblicare e nuove open call"],
  ["verbali", "Verbali delle assemblee", "quando ne esce uno nuovo"],
];
let mioPush = null, pushUnsub = null;
const iPhone = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const daHome = () => (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const pushPossibile = () => WEB && !!window.FIREBASE_VAPID && typeof firebase !== "undefined" && !!firebase.messaging && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const chiaveToken = (t) => "t" + (hash(t) >>> 0).toString(36);
const mioId = () => (WEB && S.adminMode ? slugEmail(S.me.email) : ME());
function tokenQui() { try { return localStorage.getItem("bagaera-push") || ""; } catch (e) { return ""; } }
/* a che punto sono le notifiche su questo telefono */
function statoPush() {
  if (!WEB) return "no";
  if (iPhone() && !daHome()) return "home";
  if (!pushPossibile()) return "no";
  if (Notification.permission === "denied") return "negate";
  const k = tokenQui();
  if (Notification.permission === "granted" && k && mioPush && mioPush.tokens && mioPush.tokens[k]) return "attive";
  return "spente";
}
function avviaPush() {
  if (!WEB || !ME() || pushUnsub) return;
  pushUnsub = S.db.doc("pushtoken/" + mioId()).onSnapshot((d) => { mioPush = d.exists ? d.data() : null; S.loaded.pushtoken = true; scheduleRender(); }, () => { S.loaded.pushtoken = true; });
  /* se il permesso c'è già, rinnovo il token in silenzio (Google ogni tanto lo cambia) */
  if (pushPossibile() && Notification.permission === "granted" && tokenQui()) setTimeout(() => registraToken(false).catch((e) => console.warn("push", e)), 3000);
}
function regSw() {
  return Promise.race([navigator.serviceWorker.ready, new Promise((ok) => setTimeout(() => ok(null), 4000))]);
}
function dispositivo() {
  const u = navigator.userAgent;
  return /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) ? "iPad" : /Android/.test(u) ? "Android" : /Mac/.test(u) ? "Mac" : /Windows/.test(u) ? "Windows" : "Browser";
}
async function registraToken(forza) {
  const reg = await regSw();
  const opz = { vapidKey: window.FIREBASE_VAPID }; if (reg) opz.serviceWorkerRegistration = reg;
  const t = await firebase.messaging().getToken(opz);
  if (!t) throw new Error("nessun token");
  const k = chiaveToken(t), prima = tokenQui();
  try { localStorage.setItem("bagaera-push", k); } catch (e) {}
  const giaSalvato = mioPush && mioPush.tokens && mioPush.tokens[k] && mioPush.tokens[k].t === t;
  if (giaSalvato && !forza) return k;
  const voce = { t, at: Date.now(), dove: dispositivo() };
  const via = prima && prima !== k && mioPush && mioPush.tokens && mioPush.tokens[prima] ? { [prima]: null } : {};
  if (mioPush) await wUpd("pushtoken/" + mioId(), { tokens: { ...via, [k]: voce } }, { quiet: true });
  else { await wSet("pushtoken/" + mioId(), { tokens: { [k]: voce }, no: {} }, { quiet: true }); mioPush = { tokens: { [k]: voce }, no: {} }; }
  return k;
}
ACT["push-attiva"] = async (el) => {
  if (statoPush() === "home") return spiegaHome();
  if (!pushPossibile()) return toast("Questo browser non riceve notifiche: apri BagaeraPP dall'icona sulla schermata Home.");
  if (el) el.disabled = true;
  try {
    const p = await Notification.requestPermission();
    if (p !== "granted") { toast(p === "denied" ? "Hai detto di no: per riattivarle vai nelle impostazioni del telefono → Notifiche → BagaeraPP." : "Notifiche non attivate."); render(true); return; }
    await registraToken(true);
    try { localStorage.removeItem("bagaera-push-no"); } catch (e) {}
    toast("Notifiche attive su questo telefono.", { label: "Prova", fn: () => ACT["push-prova"]() });
  } catch (e) { console.warn(e); toast("Non sono riuscito ad attivarle: riprova tra poco."); }
  if (el) el.disabled = false;
  render(true);
};
ACT["push-spegni"] = async () => {
  const k = tokenQui();
  try { await firebase.messaging().deleteToken(); } catch (e) {}
  if (k && mioPush) await wUpd("pushtoken/" + mioId(), { tokens: { [k]: null } }, { quiet: true }).catch(() => {});
  try { localStorage.removeItem("bagaera-push"); } catch (e) {}
  toast("Notifiche spente su questo telefono."); render(true);
};
ACT["push-tipo"] = async (el) => {
  const k = el.dataset.k, no = { ...((mioPush && mioPush.no) || {}) };
  no[k] = !no[k];
  mioPush = { ...(mioPush || {}), no };
  await wUpd("pushtoken/" + mioId(), { no: { [k]: no[k] } }, { quiet: true }).catch(() => toast("Non salvato: riprova."));
  render(true);
};
ACT["push-prova"] = () => {

ACT["push-nudge-no"] = () => { try { localStorage.setItem("bagaera-push-no", oggi()); } catch (e) {} render(true); };
function spiegaHome() {

/* ---------- mandare una notifica: la lascio nell'archivio, la recapita lo script ---------- */

  const io = mioId();
  let dest = a === "tutti" ? "tutti" : [...new Set(a || [])].filter((u) => u && (opz.ancheIo || (u !== io && u !== ME())));
  if (dest !== "tutti" && !dest.length) return;

  wSet("notifiche/" + genId("nt"), { a: dest, titolo: String(titolo || "").slice(0, 80), testo: String(testo || "").slice(0, 180), link: link || "", tipo: tipo || "altro", da: io, at: Date.now(), stato: "nuova" }, { quiet: true }).catch((e) => console.warn("notifica", e));

/* ================= GOOGLE CALENDAR: gli appuntamenti arrivano nel calendario di ogni socio =================
   Un calendario «Bagaera» del consiglio: ogni appuntamento ci finisce con, come invitati, i soci che lo vedono
   nell'app. Google lo mette nel loro calendario e manda le notifiche. Lo allinea chi del consiglio ha collegato Google. */
const GC = "https://www.googleapis.com/calendar/v3/";
const GC_COLORI = { evento: "10", riunione: "5", appuntamento: "7", incontro: "9" };
const gcalOk = () => WEB && !!cfg("gcal").calendarId;
const enc = encodeURIComponent;
function destinatari(e) {
  const tutti = tuttiSoci().filter((u) => S.soci[u].email);
  let uids;
  if (e.visib === "consiglio") uids = tutti.filter((u) => isCouncil(u) || invitato(e, u));
  else if (e.tipo === "incontro" && !e.aperto) uids = tutti.filter((u) => inGroup(e.gruppo, u) || invitato(e, u) || e.creatoDa === u);
  else uids = tutti;
  return [...new Set(uids.map((u) => String(S.soci[u].email).toLowerCase()))].sort();
}
const piuOre = (ora, h) => { const [a, b] = ora.split(":").map(Number); const m = a * 60 + b + h * 60; return { ora: pad(Math.floor(m / 60) % 24) + ":" + pad(m % 60), giorni: Math.floor(m / 1440) }; };
function corpoGoogle(e) {
  const tz = "Europe/Rome", base = location.origin + location.pathname.replace(/index\.html$/, "");
  let start, end;
  if (e.ora) {
    const fineData = e.dataFine || e.data;
    let fine = e.fine, giorni = 0;
    if (!fine) { const x = piuOre(e.ora, 2); fine = x.ora; giorni = x.giorni; }
    else if (fineData === e.data && fine <= e.ora) giorni = 1; // finisce dopo mezzanotte
    start = { dateTime: `${e.data}T${e.ora}:00`, timeZone: tz }; end = { dateTime: `${addDays(fineData, giorni)}T${fine}:00`, timeZone: tz };
  } else { start = { date: e.data }; end = { date: addDays(e.dataFine || e.data, 1) }; }
  const pj = e.progetto && S.progetti[e.progetto];
  const corpo = { summary: e.titolo, location: e.luogo || "", description: [pj ? "Progetto: " + pj.nome : "", e.cosa || "", "Apri in BagaeraPP: " + base + "#ev-" + e.id].filter(Boolean).join("\n\n"),
    start, end, attendees: destinatari(e).map((email) => ({ email })), guestsCanModify: false, guestsCanInviteOthers: false, guestsCanSeeOtherGuests: false,
    reminders: { useDefault: true }, colorId: GC_COLORI[e.visib === "consiglio" ? "appuntamento" : e.tipo] || "10" };
  corpo.extendedProperties = { private: { app: "bagaerapp", bagaeraId: e.id, h: String(hash(JSON.stringify(corpo))) } };
  return corpo;
}
const daAllineare = () => eventi().filter((e) => (e.dataFine || e.data) >= addDays(oggi(), -7));
let firmaCache = { k: null, v: null };
function firmaTutti() {
  if (firmaCache.k === S.cal && firmaCache.s === S.soci && firmaCache.p === S.progetti) return firmaCache.v;
  const v = String(hash(JSON.stringify(daAllineare().map((e) => [e.id, corpoGoogle(e).extendedProperties.private.h]).sort())));
  firmaCache = { k: S.cal, s: S.soci, p: S.progetti, v }; return v;
}
const gcalDaFare = () => gcalOk() && isCouncil() && firmaTutti() !== cfg("gcal").firma;
async function gcalApi(url, opts = {}) { return gapi(url, opts, SCOPI.calendar); }
/* crea il calendario «Bagaera» e dà il permesso di scriverci al consiglio */
async function gcalCrea() {
  const cal = await gcalApi(GC + "calendars", { method: "POST", body: JSON.stringify({ summary: "Bagaera", description: "Gli appuntamenti di BagaeraPP (bagaera.it/app). Si aggiorna da solo: non modificarlo a mano.", timeZone: "Europe/Rome" }) });
  await wSet("config/gcal", { calendarId: cal.id, proprietario: S.me.email, creato: Date.now(), scrittori: [] });
  return cal.id;
}
async function gcalPermessi() {
  const g = cfg("gcal"); if (!g.calendarId || String(g.proprietario).toLowerCase() !== String(S.me.email).toLowerCase()) return;
  const voluti = tuttiSoci().filter((u) => isCouncil(u) && S.soci[u].email).map((u) => S.soci[u].email.toLowerCase()).filter((m) => m !== String(g.proprietario).toLowerCase());
  const prima = g.scrittori || [];
  for (const m of voluti.filter((x) => !prima.includes(x))) await gcalApi(`${GC}calendars/${enc(g.calendarId)}/acl?sendNotifications=false`, { method: "POST", body: JSON.stringify({ role: "writer", scope: { type: "user", value: m } }) });
  for (const m of prima.filter((x) => !voluti.includes(x))) await gcalApi(`${GC}calendars/${enc(g.calendarId)}/acl/${enc("user:" + m)}`, { method: "DELETE" }).catch(() => {});
  if (JSON.stringify(prima.slice().sort()) !== JSON.stringify(voluti.slice().sort())) await wUpd("config/gcal", { scrittori: voluti });
}
let gcalInCorso = null;
function gcalAllinea(avanza = () => {}) {
  if (gcalInCorso) return gcalInCorso;
  gcalInCorso = (async () => {
    const calId = cfg("gcal").calendarId; if (!calId) throw { message: "calendario non configurato" };
    await gcalPermessi().catch((e) => console.warn("permessi", e));
    const esistenti = []; let tok = "";
    do {
      const r = await gcalApi(`${GC}calendars/${enc(calId)}/events?maxResults=2500&showDeleted=false&privateExtendedProperty=${enc("app=bagaerapp")}${tok ? "&pageToken=" + enc(tok) : ""}`);
      esistenti.push(...(r.items || [])); tok = r.nextPageToken || "";
    } while (tok);
    const perId = new Map(esistenti.map((g) => [((g.extendedProperties || {}).private || {}).bagaeraId, g]));
    const voluti = daAllineare(); let n = 0, fatti = 0;
    for (const e of voluti) {
      const corpo = corpoGoogle(e), g = perId.get(e.id); perId.delete(e.id);
      if (!g) { await gcalApi(`${GC}calendars/${enc(calId)}/events?sendUpdates=none`, { method: "POST", body: JSON.stringify(corpo) }); fatti++; }
      else if (((g.extendedProperties || {}).private || {}).h !== corpo.extendedProperties.private.h) { await gcalApi(`${GC}calendars/${enc(calId)}/events/${enc(g.id)}?sendUpdates=none`, { method: "PUT", body: JSON.stringify(corpo) }); fatti++; }
      avanza(++n, voluti.length);
    }
    for (const [id, g] of perId) if (id && (!S.cal[id] || S.cal[id].annullato)) { await gcalApi(`${GC}calendars/${enc(calId)}/events/${enc(g.id)}?sendUpdates=none`, { method: "DELETE" }).catch(() => {}); fatti++; }
    await wUpd("config/gcal", { firma: firmaTutti(), ultimo: Date.now(), da: ME() });

}
/* in sottofondo: se c'è qualcosa da mandare e il consigliere ha già dato il permesso, allinea da solo */
let gcalUltimoTentativo = 0, gcalTimer = null;
function gcalAuto() {
  if (!WEB || !gcalOk() || !pronto() || !isCouncil() || !tokenValido(SCOPI.calendar)) return;
  if (gcalInCorso || Date.now() - gcalUltimoTentativo < 8000) { if (!gcalTimer) gcalTimer = setTimeout(() => { gcalTimer = null; gcalAuto(); }, 8000 - Math.min(8000, Date.now() - gcalUltimoTentativo) + 500); return; }
  if (!gcalDaFare()) return;
  gcalUltimoTentativo = Date.now();
  setTimeout(() => gcalAllinea().then((n) => { if (n) toast(`Google Calendar aggiornato (${n} ${n === 1 ? "modifica" : "modifiche"}).`); scheduleRender(); })
    .catch((e) => { console.warn(e); if (e && e.code === "tool_error") toast("Google Calendar ha rifiutato l'aggiornamento: " + (e.message || "permesso mancante") + "."); }), 1500);
}
function gcalErrore(e) {
  if (e && e.code === "needs_token") return "serve il permesso di Google Calendar: tocca «Collega Google Calendar».";
  if (e && /has not been used|disabled/i.test(e.message || "")) return "l'API di Google Calendar non è abilitata nel progetto: abilitala in Google Cloud → API e servizi → Libreria.";
  if (e && /forbidden|insufficient|writer|notFound|Not Found/i.test(e.message || "")) return "non hai il permesso di scrivere nel calendario Bagaera: chiedi a " + (cfg("gcal").proprietario || "chi l'ha creato") + " di aprire l'app, così te lo dà.";
  return (e && e.message) || "errore sconosciuto.";
}

const normNome = (t) => norm(t).replace(/[^a-z0-9]+/g, " ").trim();

  if (c === "auth/network-request-failed") return "Non c'è connessione: riprova quando torna la rete.";
  if (c === "auth/unauthorized-domain") return "Questo indirizzo non è autorizzato in Firebase: aggiungilo tra i domini autorizzati.";
  return "Non sono riuscito a farti entrare (" + (c || (e && e.message) || "errore") + ").";
}
let iscritto = false;
async function entraConGoogle(u) {
  S.authUser = u || null; S.ui.loginStato = null;
  if (!u) { S.me = { id: null, name: "", email: "" }; S.adminMode = false; iscriviPrefs(); render(true); return; }
  const email = String(u.email || "").toLowerCase();
  if (!emailValida(email)) { S.ui.loginErr = `${email} non è un account di Bagaera: entra con quello che finisce con @${DOMINIO()}.`; await firebase.auth().signOut(); return; }
  S.ui.loginErr = "";
  if (ADMIN_EMAILS.includes(email)) { S.adminMode = true; S.me = { id: null, name: "", email }; }
  else {
    const id = slugEmail(email);
    let snap = null; try { snap = await S.db.doc("soci/" + id).get(); } catch (e) { snap = null; }
    const s = snap && snap.exists ? snap.data() : null;
    if (!s) { S.ui.loginStato = "nuovo"; S.me = { id: null, name: "", email }; render(true); avviaRichiesta(id); return; }
    if (s.attivo === false) { S.ui.loginStato = "fuori"; S.me = { id: null, name: "", email }; render(true); return; }
    S.adminMode = false; S.me = { id, name: s.nome || u.displayName || "", email };
    segnaAccesso();
  }
  if (!iscritto) { iscritto = true; iscrivi(); }
  iscriviPrefs(); S.route = parseHash(); render(true);
  gcalDopoRitorno(); vbDopoRitorno(); tesDopoRitorno(); avviaPush();
}
let richiestaUnsub = null;
function avviaRichiesta(id) {
  if (richiestaUnsub) richiestaUnsub();
  richiestaUnsub = S.db.doc("richieste/" + id).onSnapshot((d) => { S.miaRichiesta = d.exists ? d.data() : null; render(true); }, () => {});
  // quando il segretario lo aggiunge, entra da solo
  const off = S.db.doc("soci/" + id).onSnapshot((d) => { if (d.exists && S.ui.loginStato === "nuovo") { off(); entraConGoogle(firebase.auth().currentUser); } }, () => {});
}
function sincronizzaSessione() {
  if (S.adminMode || !S.me.id || !S.loaded.soci) return;
  const s = S.soci[S.me.id];
  if (!s || s.attivo === false) { esci(); return; }
  if (S.me.name !== s.nome) S.me = { ...S.me, name: s.nome || "" };
}
function esci() { closeSheet(); dimenticaToken(true); firebase.auth().signOut().then(() => location.reload()); }
ACT.esci = () => esci();
ACT["login-google"] = () => {
  if (window.GOOGLE_CLIENT_ID) return vaiAGoogle([]);
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({ hd: DOMINIO(), prompt: "select_account" });
  firebase.auth().signInWithPopup(prov).catch((e) => {
    if (e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")) return firebase.auth().signInWithRedirect(prov);

  });
};
function loginErr(msg) { S.ui.loginErr = msg; render(true); }
function vLogin() {
  const st = S.ui.loginStato, err = S.ui.loginErr;
  const testa = (t) => `<section class="hero"><span class="eyebrow">BagaeraPP · l'app dei Bagai</span><h2>${t}</h2>${om(2, "deco")}</section>`;
  if (st === "nuovo") {

      ${r ? `<div class="notice">Ciao ${esc((r.nome || "").split(" ")[0])}! La tua richiesta è arrivata al segretario: appena ti aggiunge, l'app si apre da sola.</div>`
        : `<p><b>${esc(S.me.email)}</b> non è ancora tra i soci dell'app. Chiedi di entrare: il segretario ti aggiunge.</p>
        <form data-form="login-richiesta" class="stack"><label class="field"><span>Nome e cognome</span><input class="in" name="nome" required maxlength="80" autocomplete="name" value="${esc((S.authUser && S.authUser.displayName) || "")}"></label>
          <div class="field"><span>In quali gruppi sei</span><div class="opts">${Object.entries(GRUPPI).filter(([k]) => k !== "consiglio").map(([k, g]) => checkbox("g", k, g.nome, false)).join("")}</div></div>
          <label class="field"><span>Una nota (facoltativa)</span><input class="in" name="nota" maxlength="200" placeholder="es. Sono nel gruppo decorazioni dal 2025"></label>
          <p class="err" ${err ? "" : "hidden"}>${esc(err || "")}</p><button class="btn pri block">Chiedi di entrare</button></form>`}
      <button class="btn sm ghost" data-act="esci" style="align-self:flex-start">Usa un altro account</button></div>`;
  }
  if (st === "fuori") return `<div class="wrap" style="max-width:560px">${testa("Account non attivo")}<p>Il tuo account è stato disattivato: parlane con il segretario.</p><button class="btn" data-act="esci">Esci</button></div>`;
  return `<div class="wrap" style="max-width:560px">${testa("Entra con il tuo account di Bagaera")}
    <button class="btn pri block gbtn" data-act="login-google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>Accedi con Google</button>
    <p class="err" role="alert" ${err ? "" : "hidden"}>${esc(err || "")}</p>
    <p class="small muted">Usa l'account @${esc(DOMINIO())} che ti ha dato l'associazione. Sul telefono: dopo il primo accesso, Condividi → «Aggiungi alla schermata Home» e BagaeraPP diventa un'app.</p></div>`;
}
FORMS["login-richiesta"] = async (f) => {
  const nome = fv(f, "nome"); if (normNome(nome).split(" ").length < 2) return loginErr("Scrivi nome e cognome.");
  await wSet("richieste/" + slugEmail(S.me.email), { nome, email: S.me.email, gruppi: fvAll(f, "g"), nota: fv(f, "nota"), at: Date.now() });

async function boot() {
  S.route = parseHash();
  render(true);
  if (WEB) { avviaWeb(); return; }
  let c = window.claude;
  for (let i = 0; i < 20 && !(c && c.use); i++) { await new Promise((r) => setTimeout(r, 100)); c = window.claude; }
  if (!c || !c.use) { S.noRuntime = true; render(true); return; }
  const use = (n) => c.use(n).catch(() => null);
  const [db, user, dl] = await Promise.all([use("db"), use("user"), use("downloads")]);
  S.db = db; S.user = user; S.downloads = dl;
  if (user) { try { const m = await user.me(); S.acct = { id: m.id, isOwner: !!m.isOwner, canEdit: !!(m.canEdit || m.isOwner) }; } catch (e) { /* account sconosciuto: niente permessi speciali */ } }
  if (!db) { S.noRuntime = true; render(true); return; }
  iscrivi();
  render(true);
}
