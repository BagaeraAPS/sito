:root {
  --verde: #2a952d;
  --verde-testo: #1d6f20;
  --nero: #0b0c0b;
  --bianco: #ffffff;
  --bg: #ffffff;
  --bg-2: #f2f5f1;
  --bg-3: #e6ece5;
  --ink: #0b0c0b;
  --muted: #545e55;
  --line: #d4dbd3;
  --rule: #0b0c0b;
  --accent-ink: #1d6f20;
  --ok-bg: #e2f1e1;
  --warn: #7a5100;
  --warn-bg: #fcefc9;
  --amber: #f2b705;
  --bad: #b3261e;
  --bad-bg: #fbe3df;
  --info: #1f5fa8;
  --info-bg: #e1ecf8;
  --scrim: rgba(11, 12, 11, .55);
  --shadow: 0 1px 2px rgba(11, 12, 11, .08), 0 14px 32px -18px rgba(11, 12, 11, .45);
  --f-display: "Lapi", "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --top-h: 60px;
  --tab-h: 64px;
  --side-w: 248px;
  --r-arco: 999px 999px 0 0;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0c0b; --bg-2: #151815; --bg-3: #20251f; --ink: #f2f6f1; --muted: #a4aea5; --line: #2b322b; --rule: #f2f6f1;
  --accent-ink: #5fc962; --ok-bg: #132816; --warn: #f2c33d; --warn-bg: #2d240a; --bad: #ff8b7f; --bad-bg: #351714;
  --info: #8ab8ee; --info-bg: #14243a; --scrim: rgba(0, 0, 0, .7); --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 32px -18px rgba(0,0,0,.9);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b0c0b; --bg-2: #151815; --bg-3: #20251f; --ink: #f2f6f1; --muted: #a4aea5; --line: #2b322b; --rule: #f2f6f1;
  --accent-ink: #5fc962; --ok-bg: #132816; --warn: #f2c33d; --warn-bg: #2d240a; --bad: #ff8b7f; --bad-bg: #351714;
  --info: #8ab8ee; --info-bg: #14243a; --scrim: rgba(0, 0, 0, .7); --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 32px -18px rgba(0,0,0,.9);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--nero); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-underline-offset: .18em; }
::selection { background: var(--verde); color: var(--nero); }
:focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.tiny { font-size: .76rem; }
.nowrap { white-space: nowrap; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.nw { flex-wrap: nowrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stack.s { gap: 8px; }
.stack.l { gap: 22px; }

/* tipografia di marca */
.disp, h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .01em; line-height: .98; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(1.7rem, 6.4vw, 2.6rem); }
h2 { font-size: clamp(1.25rem, 4.6vw, 1.6rem); }
h3 { font-size: 1.02rem; line-height: 1.1; }
.eyebrow { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; color: var(--muted); }
.big { font-family: var(--f-display); font-size: clamp(2.2rem, 9vw, 3.4rem); line-height: .9; font-variant-numeric: tabular-nums; }
p { margin: 0; max-width: 64ch; }

/* ---------- guscio ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--nero); color: var(--bianco);
  min-height: var(--top-h); display: flex; align-items: center; gap: 12px; border-bottom: 3px solid var(--verde);
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 6px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--bianco); min-width: 0; }
.brand .picto { width: 58px; height: 32px; fill: var(--verde); flex: none; }
.brand .wm { display: flex; flex-direction: column; gap: 3px; line-height: 1; }
.brand .wm svg { width: 98px; height: 13px; fill: var(--bianco); display: block; }
.brand .wmr { display: flex; align-items: flex-end; gap: 2px; }
.brand .pp { font: 700 18.6px/13px var(--f-display); font-style: normal; color: var(--verde); letter-spacing: .01em; height: 13px; display: block; }
.brand .wm b { font-family: var(--f-display); font-weight: 400; font-size: .64rem; letter-spacing: .3em; color: var(--verde); }
.top .sp { flex: 1; }
.tb { position: relative; display: grid; place-items: center; width: 42px; height: 42px; border: 2px solid transparent; background: none; color: var(--bianco); border-radius: 0; text-decoration: none; }
.tb:hover { border-color: var(--verde); }
.tb svg { width: 22px; height: 22px; }
.tb .badge { position: absolute; top: 2px; right: 0; }
.tb img, .tb .ini { width: 32px; height: 32px; border-radius: 50%; }
.badge { min-width: 20px; height: 20px; padding: 0 5px; display: inline-grid; place-items: center; background: var(--amber); color: var(--nero); font: 700 .72rem/1 var(--f-display); border: 2px solid var(--nero); }
.badge.r { background: var(--bad); color: #fff; }

.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.side { display: none; }
main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--tab-h) + 34px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 2px solid var(--rule);
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: var(--tab-h); text-decoration: none; color: var(--muted); font: 400 .7rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; position: relative; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a[aria-current="page"] { color: var(--ink); }
.tabs a[aria-current="page"]::before { content: ""; position: absolute; top: -2px; left: 22%; right: 22%; height: 5px; background: var(--verde); }
.tabs a .badge { position: absolute; top: 7px; left: calc(50% + 6px); }
@media (min-width: 900px) {
  :root { --tab-h: 0px; }
  .shell { grid-template-columns: var(--side-w) minmax(0, 1fr); }
  .tabs { display: none; }
  .side { display: flex; flex-direction: column; gap: 2px; padding: 18px 12px 30px; border-right: 2px solid var(--rule); background: var(--bg);
    position: sticky; top: calc(var(--top-h) + 3px + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top-h) - 3px - env(safe-area-inset-top, 0px)); overflow-y: auto; align-self: start; }

/* ---------- pezzi ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border: 2px solid var(--rule); background: var(--bg); color: var(--ink);

.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.panel { border: 2px solid var(--rule); background: var(--bg); min-width: 0; }

.panel > .pb { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.soft { background: var(--bg-2); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); min-width: 0; text-decoration: none; color: inherit; background: none; width: 100%; text-align: left; border-left: 0; border-right: 0; border-bottom: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.av { width: 30px; height: 30px; border-radius: 50%; flex: none; object-fit: cover; display: inline-grid; place-items: center; font: 400 .7rem/1 var(--f-display); color: #fff; background: var(--muted); }
.av.l { width: 54px; height: 54px; font-size: 1.1rem; }

.sw { position: relative; cursor: pointer; }

/* campi */

  border-top: 4px solid var(--verde); display: flex; flex-direction: column; animation: su .26s cubic-bezier(.16,1,.3,1); }

.x { width: 44px; height: 44px; border: 2px solid var(--rule); background: var(--bg); display: grid; place-items: center; flex: none; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--top-h) + 14px + env(safe-area-inset-top, 0px)); z-index: 80; background: var(--ink); color: var(--bg);
  border: 2px solid var(--verde); padding: 12px 16px; font-weight: 650; max-width: calc(100% - 32px); display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow); }

/* ---------- home ---------- */
.count svg, .pill svg, .notice svg, .eyebrow svg { width: 1.05em; height: 1.05em; vertical-align: -.18em; display: inline-block; }

/* dettaglio evento */

.mat { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); min-width: 0; }
.mat:first-child { border-top: 0; }
.mat .box { width: 28px; height: 28px; border: 2px solid var(--rule); background: var(--bg); display: grid; place-items: center; flex: none; padding: 0; }
.mat .box svg { width: 18px; height: 18px; opacity: 0; }
.mat.ok .box { background: var(--verde); border-color: var(--verde); color: var(--nero); }
.mat.ok .box svg { opacity: 1; }
.mat.ok .t { text-decoration: line-through; color: var(--muted); }
.rsvp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid var(--rule); }
.rsvp button { border: 0; border-left: 2px solid var(--rule); background: var(--bg); min-height: 50px; font: 400 .8rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.rsvp button:first-child { border-left: 0; }
.rsvp button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.rsvp button[aria-pressed="true"][data-v="si"] { background: var(--verde); color: var(--nero); }
.codebox { display: flex; gap: 14px; align-items: center; justify-content: space-between; background: var(--nero); color: var(--bianco); padding: 14px 16px; flex-wrap: wrap; }
.codebox .code { font: 700 2.4rem/1 var(--f-display); letter-spacing: .3em; color: var(--verde); }
.codein { display: flex; gap: 8px; }
.codein input { font: 700 1.6rem/1 var(--f-display); letter-spacing: .4em; text-align: center; width: 9ch; }

/* medaglie */
.medals { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 10px; }
.medal { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; background: none; border: 0; padding: 0; color: inherit; }
.medal svg.mb { width: 88px; height: 88px; filter: drop-shadow(0 3px 0 rgba(11,12,11,.35)); }
.medal.lock svg.mb { filter: none; opacity: .3; }
.medal b { font: 400 .7rem/1.15 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.medal small { font-size: .7rem; color: var(--muted); }
.unlock { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 10px 0 4px; }
.unlock svg.mb { width: 170px; height: 170px; animation: conio 1s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes conio { 0% { transform: scale(.2) rotate(-200deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }
.unlock .om { display: flex; gap: 10px; }
.unlock .om svg { width: 30px; height: 40px; fill: var(--verde); animation: balla .9s ease-in-out infinite; }
.unlock .om svg:nth-child(2) { animation-delay: .15s; }
.unlock .om svg:nth-child(3) { animation-delay: .3s; }

/* gruppi */
.gcards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.gcard { display: flex; gap: 14px; align-items: center; border: 2px solid var(--rule); padding: 14px; text-decoration: none; color: inherit; background: var(--bg); position: relative; min-width: 0; }
.gcard:hover { background: var(--bg-2); }
.gcard.mine { background: var(--verde); color: var(--nero); }
.gcard.mine .s { color: var(--nero); }
.gcard svg.om { width: 40px; height: 52px; fill: currentColor; flex: none; }
.gcard .t { font: 700 1.05rem/1.05 var(--f-display); text-transform: uppercase; }
.gcard .s { font-size: .82rem; color: var(--muted); }
.budget .bar { height: 18px; border: 2px solid var(--rule); background: var(--bg); position: relative; overflow: hidden; }
.budget .bar i { position: absolute; inset: 0 auto 0 0; background: var(--verde); }
.budget .bar i.over { background: var(--bad); }

/* finanze e grafici */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.kpi { border: 2px solid var(--rule); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi.v { background: var(--verde); color: var(--nero); }
.kpi .l { font: 400 .68rem/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; }
.kpi:not(.v) .l { color: var(--muted); }
.kpi .n { font: 700 1.5rem/1 var(--f-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .s { font-size: .78rem; }
.kpi:not(.v) .s { color: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 600 11px var(--f-body); }
.chart .ax { stroke: var(--line); }
.hb { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.hb:first-child { border-top: 0; }
.hb .tr { grid-column: 1 / -1; height: 8px; background: var(--bg-3); position: relative; }
.hb .tr i { position: absolute; top: 0; bottom: 0; background: var(--verde); }
.hb .tr i.neg { background: var(--bad); }
.tbl-wrap { overflow-x: auto; border: 2px solid var(--rule); }
table.tbl { border-collapse: collapse; width: 100%; font-size: .9rem; }
.tbl th { background: var(--ink); color: var(--bg); font: 400 .68rem/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .07em; text-align: left; padding: 9px 10px; white-space: nowrap; }
.tbl td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tfoot td { font-weight: 800; border-top: 2px solid var(--rule); }

/* magazzino e cassa */
.lots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.qty { font: 700 1.4rem/1 var(--f-display); text-align: right; min-width: 3ch; font-variant-numeric: tabular-nums; }
.qty small { display: block; font: 600 .66rem/1.2 var(--f-body); color: var(--muted); margin-top: 3px; }
.qty.low { color: var(--bad); }
.stepper { display: inline-flex; border: 2px solid var(--rule); }
.stepper button { width: 44px; height: 44px; border: 0; background: var(--bg); font: 700 1.3rem/1 var(--f-display); }
.stepper button:hover { background: var(--bg-2); }
.stepper input { width: 62px; border: 0; border-left: 2px solid var(--rule); border-right: 2px solid var(--rule); text-align: center; font: 700 1.1rem/1 var(--f-display); background: var(--bg); -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 2px solid var(--rule); }
.modes button { border: 0; border-left: 2px solid var(--rule); background: var(--bg); min-height: 54px; font: 400 .84rem/1 var(--f-display); text-transform: uppercase; display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; }
.modes button:first-child { border-left: 0; }
.modes button small { font: 600 .66rem/1 var(--f-body); text-transform: none; opacity: .8; }
.modes button[aria-pressed="true"][data-m="k"] { background: var(--verde); color: var(--nero); }
.modes button[aria-pressed="true"][data-m="c"] { background: var(--info); color: #fff; }
.modes button[aria-pressed="true"][data-m="i"] { background: var(--amber); color: var(--nero); }
.ctot { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.ctot div { border: 2px solid var(--rule); padding: 8px 10px; min-width: 0; }
.ctot b { display: block; font: 700 1.15rem/1.1 var(--f-display); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.ctot span { font: 400 .62rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
@media (max-width: 520px) { .ctot { gap: 4px; } .ctot div { padding: 6px 6px; } .ctot b { font-size: .9rem; white-space: nowrap; } .ctot span { font-size: .52rem; letter-spacing: .02em; } }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
@media (max-width: 420px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { position: relative; border: 2px solid var(--rule); background: var(--bg); min-height: 104px; padding: 11px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
  user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; min-width: 0; }
.tile:active { transform: scale(.97); }
.tile .tn { font-weight: 750; line-height: 1.15; overflow-wrap: anywhere; padding-right: 32px; }
.tile .tp { font-size: .76rem; color: var(--muted); padding-right: 36px; }
.tile .tp b { font: 700 1.05rem/1 var(--f-display); color: var(--ink); display: block; }
.tile .cnt { position: absolute; top: 8px; right: 8px; min-width: 30px; height: 30px; padding: 0 6px; display: grid; place-items: center; background: var(--verde); color: var(--nero); font: 700 1rem/1 var(--f-display); }
.tile .minus { position: absolute; bottom: 8px; right: 8px; width: 32px; height: 32px; border: 2px solid var(--rule); background: var(--bg-2); font: 700 1.1rem/1 var(--f-display); display: grid; place-items: center; }
.tile.flash { animation: flash .35s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--verde); } 100% { box-shadow: 0 0 0 12px transparent; } }
.tile.out { opacity: .55; }
.regbar { position: sticky; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 10; display: flex; gap: 8px; align-items: center; background: var(--bg); border: 2px solid var(--rule); padding: 8px; box-shadow: var(--shadow); }
.regbar .grow { font-size: .84rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* sponsor */
.goal { background: var(--verde); color: var(--nero); border: 2px solid var(--rule); padding: 16px; display: grid; gap: 10px; }
.goal .big { color: var(--nero); }
.gbar { height: 18px; border: 2px solid var(--nero); background: var(--verde); position: relative; overflow: hidden; }
.gbar i { position: absolute; inset: 0 auto 0 0; background: var(--nero); }
.gbar b { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(-45deg, var(--nero) 0 3px, transparent 3px 7px); opacity: .5; }
.pipe { display: flex; height: 26px; border: 2px solid var(--nero); background: var(--bianco); }
.pipe span { display: block; height: 100%; border-right: 2px solid var(--nero); }
.pipe span:last-child { border-right: 0; }
.s-da_contattare { background: var(--bianco); }
.s-contattato { background: #c4cec4; }
.s-promesso { background: var(--amber); }
.s-pagato { background: var(--nero); }
.s-rifiutato { background: repeating-linear-gradient(45deg, #fff 0 4px, #c4cec4 4px 6px); }
.leg { display: flex; flex-wrap: wrap; gap: 6px 12px; font-weight: 700; font-size: .82rem; }
.leg span { display: inline-flex; align-items: center; gap: 6px; }
.leg i { width: 12px; height: 12px; border: 2px solid var(--nero); display: inline-block; }
.stati { display: grid; grid-template-columns: repeat(auto-fit, minmax(98px, 1fr)); gap: 6px; }
.stati button { border: 2px solid var(--rule); background: var(--bg); padding: 9px 6px; font: 400 .7rem/1 var(--f-display); text-transform: uppercase; display: flex; gap: 6px; align-items: center; justify-content: center; }
.stati button i { width: 10px; height: 10px; border: 2px solid var(--nero); flex: none; }
.stati button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.foglio { border: 2px solid var(--rule); background: #fff; color: #0b0c0b; padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
.foglio .fh { display: flex; justify-content: space-between; gap: 12px; border-bottom: 3px solid #0b0c0b; padding-bottom: 10px; align-items: flex-start; }
.foglio .fh svg { width: 84px; height: 46px; fill: #2a952d; flex: none; }
.foglio .fa { text-align: right; font-size: .74rem; color: #545e55; }
.foglio .fs { background: #2a952d; border: 2px solid #0b0c0b; padding: 10px; }
.foglio .fs .big { font-size: 1.9rem; color: #0b0c0b; }
.foglio .lab { font: 400 .64rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: #545e55; }
.foglio .stamp { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) rotate(-18deg); color: #b3261e; border: 4px solid #b3261e; padding: 4px 14px; font: 700 2rem/1 var(--f-display); opacity: .8; }

/* profilo */
.me { display: flex; gap: 14px; align-items: center; border: 2px solid var(--rule); padding: 14px; flex-wrap: wrap; }
.me .av { width: 64px; height: 64px; font-size: 1.3rem; }
.tb .av { width: 34px; height: 34px; }
.tessera { background: var(--verde); color: var(--nero); border: 2px solid var(--nero); padding: 14px; position: relative; overflow: hidden; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
.tessera .pat { position: absolute; inset: 0; opacity: .16; pointer-events: none; }
.tessera .pat svg { position: absolute; width: 46px; height: 60px; fill: none; stroke: var(--nero); stroke-width: 3; }
.tessera .tw { width: 120px; height: 16px; fill: var(--bianco); position: relative; }
.tessera .tn { font: 700 1.4rem/1 var(--f-display); position: relative; }
.timeline { display: flex; gap: 4px; flex-wrap: wrap; }
.timeline i { width: 16px; height: 16px; border: 2px solid var(--rule); display: block; }
.timeline i.y { background: var(--verde); border-color: var(--verde); }
.timeline i.n { background: var(--bg); }
.steps { display: flex; align-items: center; gap: 0; }
.steps span { flex: 1; height: 6px; background: var(--bg-3); }
.steps span.on { background: var(--verde); }
.steps span.bad { background: var(--bad); }
.foto { max-width: 100%; max-height: 360px; border: 2px solid var(--rule); display: block; }

.loading { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 70px 16px; text-align: center; color: var(--muted); }
.loading .om { display: flex; gap: 10px; }
.loading .om svg { width: 34px; height: 44px; fill: var(--verde); animation: balla .9s ease-in-out infinite; }
.loading .om svg:nth-child(2) { animation-delay: .15s; }
.loading .om svg:nth-child(3) { animation-delay: .3s; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ===== sorgente degli appuntamenti, proposte dalla posta ===== */
.fonte { display: flex; gap: 12px; align-items: center; border: 2px solid var(--rule); border-left: 6px solid #13707a; padding: 12px 14px; flex-wrap: wrap; }
.fonte .ic { width: 38px; height: 38px; display: grid; place-items: center; background: var(--bg-2); flex: none; }
.fonte .ic svg { width: 20px; height: 20px; }
.fonte .grow { min-width: 0; flex: 1 1 200px; overflow-wrap: anywhere; }
.prop { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-top: 1px solid var(--line); }
.prop:first-child { border-top: 0; }
.prop .tiny svg { width: 1em; height: 1em; vertical-align: -.15em; }
.li .ic { width: 38px; height: 38px; display: grid; place-items: center; flex: none; background: var(--bg-2); }
.li .ic svg { width: 20px; height: 20px; }
details.rip { border: 2px dashed var(--line); padding: 10px 12px; }
details.rip summary { cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 8px; }
details.rip summary svg { width: 18px; height: 18px; }
.pjcard .pjsq { width: 40px; height: 40px; flex: none; border: 2px solid var(--rule); }
.gcard.arch { opacity: .6; }
/* ===== riga con spunta ===== */
.lirow { display: flex; align-items: stretch; border-top: 1px solid var(--line); }
.lirow:first-child { border-top: 0; }
.lirow > .li { border-top: 0; flex: 1; min-width: 0; }
.tick { flex: none; width: 74px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; border-left: 1px solid var(--line); background: var(--bg-2); color: var(--ink); font: 400 .58rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
.tick svg { width: 26px; height: 26px; padding: 3px; border: 2px solid var(--rule); background: var(--bg); color: transparent; }
.tick:hover svg, .tick:focus-visible svg { color: var(--muted); }
.tick.on svg, .tick[disabled] svg { background: var(--verde); color: var(--nero); border-color: var(--verde); }
/* ===== carte ===== */
.ccards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.ccwrap { display: flex; flex-direction: column; border: 2px solid var(--rule); min-width: 0; }
.ccard { position: relative; min-height: 172px; background: #0b0c0b; color: #fff; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; overflow: hidden; }
@media (min-width: 700px) { .ccard { aspect-ratio: 1.586; min-height: 0; padding: 16px 18px; } }
.ccard::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: var(--verde); opacity: .9; }
.ccard.bancomat { background: #13707a; }
.ccard.bancomat::after { background: #0b0c0b; opacity: .35; }
.ccard > * { position: relative; z-index: 1; }
.ccard .eyebrow { color: #c4cec4; }
.ccnome { font: 700 1.1rem/1.1 var(--f-display); padding-right: 40px; text-transform: uppercase; letter-spacing: .02em; }
.ccnum { font: 400 1.05rem/1 ui-monospace, monospace; letter-spacing: .12em; }
.ccint { font: 400 .78rem/1.2 var(--f-display); letter-spacing: .08em; overflow-wrap: anywhere; }
.ccsaldo { text-align: right; font: 700 1.3rem/1 var(--f-display); }
.ccsaldo small { display: block; font: 400 .6rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: #c4cec4; margin-bottom: 4px; }
.ccbud { font: 400 .62rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px; color: #fff; border: 1.5px solid #fff; }
.ccedit { position: absolute !important; right: 10px; top: 46px; background: rgba(0,0,0,.35); border: 0; color: #fff; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; }
.ccedit svg { width: 18px; height: 18px; }
.cchold { display: flex; gap: 10px; align-items: center; padding: 10px 12px; flex-wrap: wrap; border-top: 2px solid var(--rule); }
.cchold .grow { min-width: 120px; }
.stackbar { display: flex; height: 18px; border: 2px solid var(--rule); background: var(--bg-3); overflow: hidden; }
.stackbar i { display: block; height: 100%; }
.stackbar i.libero, .budrow i.libero { background: repeating-linear-gradient(45deg, var(--bg-3) 0 4px, var(--muted) 4px 6px); }
.budrows { display: flex; flex-direction: column; }
.budrow { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.budrow:first-child { border-top: 0; }
.budrow > i { width: 14px; height: 34px; flex: none; }
.budrow .v { font: 700 1.2rem/1 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.budrow .v.neg, .li .v.neg { color: var(--bad); }
.li .v.pos { color: var(--accent-ink); }

/* =====================================================================
   TEMA MORBIDO (novembre 2026): verde bosco al posto del nero piatto, superfici
   chiare con un filo di ombra, forme arrotondate, il pattern «se fem?» come trama.

  --bosco: #17281f; --bosco-2: #21382b; --nero: #142019;
  --verde-forte: #23812a; --verde-scuro: #1c6b22;
  --bg: #f2f5f0; --bg-2: #e9efe6; --bg-3: #dbe4d8; --surf: #ffffff;
  --ink: #142019; --muted: #5b695e; --line: #e0e7dd; --rule: #cdd8ca;
  --ok-bg: #e3f1e2; --accent-ink: #1d6f22;
  --r-s: 12px; --r-m: 18px; --r-l: 26px; --r-p: 999px;
  --sh-1: 0 1px 2px rgba(20, 32, 25, .05), 0 3px 10px -4px rgba(20, 32, 25, .08);
  --sh-2: 0 2px 4px rgba(20, 32, 25, .05), 0 18px 40px -18px rgba(20, 32, 25, .32);
  --shadow: var(--sh-2);
  --scrim: rgba(14, 24, 18, .5);
  --tab-h: 62px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bosco: #101c15; --bosco-2: #1a2c21; --bg: #0e1611; --bg-2: #152019; --bg-3: #1e2b22; --surf: #172219; --ink: #ecf3ea; --muted: #9eaea2; --line: #233128; --rule: #2e3e33;
  --ok-bg: #163220; --accent-ink: #6bd06e; --sh-1: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px -6px rgba(0,0,0,.5); --sh-2: 0 2px 6px rgba(0,0,0,.4), 0 22px 44px -20px rgba(0,0,0,.85); --scrim: rgba(0,0,0,.6); } }
:root[data-theme="dark"] {
  --bosco: #101c15; --bosco-2: #1a2c21; --bg: #0e1611; --bg-2: #152019; --bg-3: #1e2b22; --surf: #172219; --ink: #ecf3ea; --muted: #9eaea2; --line: #233128; --rule: #2e3e33;
  --ok-bg: #163220; --accent-ink: #6bd06e; --sh-1: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px -6px rgba(0,0,0,.5); --sh-2: 0 2px 6px rgba(0,0,0,.4), 0 22px 44px -20px rgba(0,0,0,.85); --scrim: rgba(0,0,0,.6); }

body { background: var(--bg); }
/* la trama «se fem?»: un velo del colore del testo, molto leggero */
.top::before, .hero::before, .tessera::before, .ccard::before, .evhead .band::before, .live::before, .codebox::before, .gcard.mine::before, .kpi.v::before, .goal::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0; background: var(--pat-col, currentColor); opacity: var(--pat-op, .08);
  -webkit-mask: var(--pat) 0 0 / var(--pat-w, 73px) var(--pat-h, 44px) repeat; mask: var(--pat) 0 0 / var(--pat-w, 73px) var(--pat-h, 44px) repeat; }
.top > *, .live > *, .codebox > *, .gcard.mine > *, .kpi.v > *, .goal > * { position: relative; z-index: 1; }

/* testata */
.top { background: linear-gradient(120deg, var(--bosco) 0%, var(--bosco-2) 100%); border-bottom: 0; box-shadow: 0 1px 0 rgba(42, 149, 45, .55), 0 10px 24px -18px rgba(0, 0, 0, .6); --pat-op: .06; --pat-col: #8fd391; }
body::before { background: var(--bosco); }
.tb { border: 0; border-radius: 50%; }
.tb:hover { background: rgba(255, 255, 255, .08); }
.badge { border-radius: var(--r-p); border: 2px solid var(--bosco); }

/* tipografia più morbida: niente etichette tutte maiuscole */
.eyebrow { font-family: var(--f-body); font-weight: 600; text-transform: none; letter-spacing: .005em; font-size: .82rem; }
.field > span { font-family: var(--f-body); font-weight: 600; text-transform: none; letter-spacing: 0; font-size: .84rem; color: var(--ink); }
.back { font-family: var(--f-body); font-weight: 600; text-transform: none; letter-spacing: 0; font-size: .86rem; }
.wk { font-family: var(--f-body); font-weight: 650; text-transform: none; letter-spacing: 0; font-size: .82rem; border-top: 1px solid var(--line); }
.pill { font-family: var(--f-body); font-weight: 650; text-transform: none; letter-spacing: 0; font-size: .72rem; border-radius: var(--r-p); padding: 4px 9px; border-width: 1px; }
.pill.verde { background: var(--ok-bg); color: var(--accent-ink); border-color: transparent; }
h1 { letter-spacing: .005em; }

/* bottoni a pillola */
.btn { border-radius: var(--r-p); border: 1px solid var(--rule); background: var(--surf); font: 650 .95rem/1 var(--f-body); text-transform: none; letter-spacing: 0; box-shadow: var(--sh-1);
  transition: background-color .18s, box-shadow .18s, transform .12s, filter .18s; }
.btn:hover { background: var(--bg-2); color: var(--ink); }
.btn:active { transform: scale(.98); }
.btn.pri { background: linear-gradient(180deg, var(--verde-forte), var(--verde-scuro)); color: #fff; border-color: transparent; box-shadow: 0 1px 0 rgba(255,255,255,.22) inset, 0 6px 14px -8px rgba(10, 20, 14, .45); }
.btn.pri:hover { background: linear-gradient(180deg, var(--verde-forte), var(--verde-scuro)); color: #fff; filter: brightness(1.07); border-color: transparent; }
.btn.dark { background: linear-gradient(180deg, var(--bosco-2), var(--bosco)); color: #fff; border-color: transparent; }
.btn.dark:hover { background: var(--bosco); color: #fff; filter: brightness(1.15); border-color: transparent; }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn.danger { color: var(--bad); background: var(--bad-bg); border-color: transparent; box-shadow: none; }
.btn.danger:hover { background: var(--bad); color: #fff; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: .84rem; }
.btn.block { border-radius: var(--r-m); }
.x { border: 0; border-radius: 50%; background: var(--bg-2); }
.x:hover { background: var(--bg-3); color: var(--ink); }

/* schede e pannelli */
.panel { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: var(--sh-1); overflow: hidden; }
.panel > .ph { border-bottom: 1px solid var(--line); padding: 14px 16px; }
.panel > .pb { padding: 16px; }
details.panel > summary { list-style: none; }
.soft { border-radius: var(--r-s); }
.notice { border-radius: var(--r-s); border-left-width: 4px; }
.me { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surf); box-shadow: var(--sh-1); }
.empty .om svg { fill: var(--bg-3); }

/* filtri, segmenti, opzioni */
.chip { border-radius: var(--r-p); border: 1px solid var(--rule); background: var(--surf); font: 600 .84rem/1 var(--f-body); text-transform: none; letter-spacing: 0; padding: 9px 14px; }
.chip[aria-pressed="true"] { background: var(--bosco); color: #fff; border-color: var(--bosco); }
.seg { border: 0; background: var(--bg-3); border-radius: var(--r-p); padding: 4px; gap: 2px; }
.seg button { border: 0; border-radius: var(--r-p); background: transparent; font: 650 .86rem/1 var(--f-body); text-transform: none; letter-spacing: 0; min-height: 36px; padding: 0 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surf); color: var(--ink); box-shadow: var(--sh-1); }
.opt span { border: 1px solid var(--rule); border-radius: var(--r-s); background: var(--surf); font: 600 .86rem/1.2 var(--f-body); text-transform: none; letter-spacing: 0; }
.opt input:checked + span { background: var(--ok-bg); color: var(--accent-ink); border-color: var(--verde); box-shadow: inset 0 0 0 1px var(--verde); }
.rsvp, .modes { border: 0; background: var(--bg-3); border-radius: var(--r-p); padding: 4px; gap: 4px; }
.rsvp button, .modes button { border: 0; border-radius: var(--r-p); background: transparent; font: 650 .9rem/1 var(--f-body); text-transform: none; letter-spacing: 0; }
.rsvp button[aria-pressed="true"] { background: var(--surf); color: var(--ink); box-shadow: var(--sh-1); }
.rsvp button[aria-pressed="true"][data-v="si"] { background: linear-gradient(180deg, var(--verde-forte), var(--verde-scuro)); color: #fff; }
.modes button { min-height: 50px; }
.stepper { border: 1px solid var(--rule); border-radius: var(--r-p); overflow: hidden; background: var(--surf); }
.stepper button { background: transparent; }
.stepper input { border-color: var(--line); background: transparent; }
.stati button { border: 1px solid var(--rule); border-radius: var(--r-p); font: 600 .78rem/1 var(--f-body); text-transform: none; }

/* campi */
.in, select.in, textarea.in { border: 1px solid var(--rule); border-radius: var(--r-s); background: var(--surf); }
.in:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 4px rgba(42, 149, 45, .18); }
.money { border: 1px solid var(--rule); border-radius: var(--r-s); overflow: hidden; background: var(--surf); }
.money b { background: var(--bg-2); color: var(--accent-ink); }
.money input { background: transparent; }
.money:focus-within { outline: none; border-color: var(--verde); box-shadow: 0 0 0 4px rgba(42, 149, 45, .18); }
details.rip { border: 1px dashed var(--rule); border-radius: var(--r-s); }

/* pannello dal basso */
.sheet { border-top: 0; border-radius: var(--r-l) var(--r-l) 0 0; background: var(--surf); box-shadow: 0 -10px 40px -10px rgba(0, 0, 0, .3); }
.sheet::before { content: ""; position: sticky; top: 0; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--rule); margin: 8px auto -4px; z-index: 3; flex: none; }
.sheet .sh-h, .sheet .sh-f { background: var(--surf); border-color: var(--line); border-width: 1px; }
@media (min-width: 700px) { .sheet { border: 0; border-radius: var(--r-l); box-shadow: var(--sh-2), 0 30px 80px -30px rgba(0,0,0,.45); } .sheet::before { display: none; } }
.toast { border: 0; border-radius: var(--r-p); background: var(--bosco); color: #fff; box-shadow: var(--sh-2); padding: 12px 20px; }

/* barra in basso: una pillola sospesa, sfocata */
.tabs { left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 0 6px; border: 1px solid var(--line); border-radius: 24px;
  background: color-mix(in srgb, var(--surf) 82%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); box-shadow: var(--sh-2); }
.tabs a { font: 650 .68rem/1 var(--f-body); text-transform: none; letter-spacing: 0; }
.tabs a svg { width: 23px; height: 23px; padding: 0; border-radius: 12px; transition: background-color .2s; box-sizing: content-box; padding: 4px 14px; }
.tabs a[aria-current="page"] { color: var(--accent-ink); }
.tabs a[aria-current="page"]::before { display: none; }
.tabs a[aria-current="page"] svg { background: var(--ok-bg); }
.tabs a .badge { top: 4px; }
main { padding-block: 18px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) {
  :root { --tab-h: 0px; }
  .side { background: transparent; border-right: 1px solid var(--line); padding: 18px 12px 30px; }
  .side a { border-radius: var(--r-s); font-weight: 600; }
  .side a[aria-current="page"] { background: var(--ok-bg); color: var(--accent-ink); }
  .side .sh { font-family: var(--f-body); font-weight: 650; text-transform: none; letter-spacing: 0; font-size: .8rem; }
  main { padding-block: 28px 60px; }
}

/* home */
.hero { border: 0; border-radius: var(--r-l); padding: 22px 20px; background: linear-gradient(135deg, #2fa233 0%, var(--verde) 45%, #1d7322 100%); color: #fff; box-shadow: 0 18px 40px -22px rgba(10, 20, 14, .55); --pat-col: #0d3d12; --pat-op: .16; }
.hero > *:not(.deco) { position: relative; z-index: 1; }
.hero .eyebrow { color: rgba(255, 255, 255, .85); }
.hero h2 { color: #fff; text-shadow: none; }
.hero .deco { fill: #0d3d12; opacity: .22; z-index: 1; }
.hero .btn { border: 0; }
.hero .btn.dark, .hero .btn.sm:not(.dark) { background: rgba(10, 40, 14, .9); color: #fff; }
.hero .btn:not(.dark) { background: rgba(255, 255, 255, .92); color: var(--verde-scuro); box-shadow: none; }
.hero .btn:not(.dark):hover, .hero .btn[aria-pressed="true"] { background: #fff; color: var(--nero); }
.hero .btn[aria-pressed="true"] { box-shadow: inset 0 0 0 2px #0d3d12; }
.count { border-radius: var(--r-p); font-family: var(--f-body); font-weight: 650; text-transform: none; letter-spacing: 0; font-size: .82rem; padding: 6px 12px; background: rgba(10, 40, 14, .85); color: #c9f0ca; }
.arco { border: 1px solid var(--line); background: var(--surf); box-shadow: var(--sh-1); }
.arco.v { background: linear-gradient(180deg, #34a838, var(--verde-scuro)); color: #fff; border-color: transparent; }
.arco .l { font-family: var(--f-body); font-weight: 600; text-transform: none; letter-spacing: 0; font-size: .74rem; }
.todo .li .ic, .li .ic, .fonte .ic { border-radius: 12px; }
.tool { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surf); box-shadow: var(--sh-1); transition: transform .15s, box-shadow .15s; }
.tool:hover { background: var(--surf); color: var(--ink); transform: translateY(-2px); box-shadow: var(--sh-2); }
.tool:hover small { color: var(--muted); opacity: 1; }
.tool svg { color: var(--verde); }
.tool b { font: 650 .95rem/1.15 var(--f-body); text-transform: none; letter-spacing: 0; }
.live { border: 0; border-radius: var(--r-m); background: linear-gradient(120deg, var(--bosco), var(--bosco-2)); position: relative; overflow: hidden; --pat-col: #8fd391; --pat-op: .07; }

/* calendario */
.cal { border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; background: var(--surf); box-shadow: var(--sh-1); }
.cal .dow { font-family: var(--f-body); font-weight: 650; text-transform: none; border-bottom: 1px solid var(--line); }
.cal .d { background: var(--surf); }
.cal .d.out { background: var(--bg); }
.cal .d .n { border-radius: 50%; }
.cal .d[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--verde); background: color-mix(in srgb, var(--ok-bg) 60%, var(--surf)); }
.cal .d[aria-pressed="true"] .n { text-decoration: none; }
.cal .ce.s { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
.cal .ce.e { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
.when { border: 1px solid var(--rule); border-radius: 14px; }
.calleg i, .sq { border-radius: 4px; }

/* dettaglio evento */
.evhead { border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; background: var(--surf); box-shadow: var(--sh-1); }
.evhead .band { --pat-op: .1; }
.evhead .band > *:not(.deco) { position: relative; z-index: 1; }
.evhead .band.evento { background: linear-gradient(135deg, #2fa233, var(--verde) 50%, #1d7322); color: #fff; --pat-col: #0d3d12; --pat-op: .16; }
.evhead .band.evento h1 { color: #fff; }
.evhead .band.incontro { background: linear-gradient(120deg, var(--bosco), var(--bosco-2)); color: #fff; --pat-col: #8fd391; --pat-op: .07; }
.evhead .facts > div { border-top: 1px solid var(--line); }
.evhead .facts b { font-family: var(--f-body); font-weight: 700; text-transform: none; }
.mat .box { border: 1px solid var(--rule); border-radius: 8px; }
.codebox { border-radius: var(--r-m); background: linear-gradient(120deg, var(--bosco), var(--bosco-2)); position: relative; overflow: hidden; --pat-col: #8fd391; --pat-op: .08; }
.fonte { border: 1px solid var(--line); border-left: 4px solid #13707a; border-radius: var(--r-s); background: var(--surf); }

/* gruppi, numeri, tabelle */
.gcard { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surf); box-shadow: var(--sh-1); overflow: hidden; }
.gcard:hover { background: var(--surf); box-shadow: var(--sh-2); }
.gcard.mine { background: linear-gradient(135deg, #2fa233, var(--verde-scuro)); color: #fff; border-color: transparent; --pat-col: #0d3d12; --pat-op: .14; }
.gcard.mine .s { color: rgba(255, 255, 255, .85); }
.gcard .t { font-size: 1rem; }
.pjcard .pjsq { border: 0; border-radius: 12px; }
.kpi { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surf); box-shadow: var(--sh-1); }
.kpi.v { background: linear-gradient(135deg, #2fa233, var(--verde-scuro)); color: #fff; border-color: transparent; position: relative; overflow: hidden; --pat-col: #0d3d12; --pat-op: .14; }
.kpi .l { font-family: var(--f-body); font-weight: 600; text-transform: none; letter-spacing: 0; font-size: .78rem; }
.goal { border: 0; border-radius: var(--r-l); background: linear-gradient(135deg, #2fa233, var(--verde-scuro)); color: #fff; position: relative; overflow: hidden; --pat-col: #0d3d12; --pat-op: .14; }
.goal .big { color: #fff; }
.gbar, .pipe, .budget .bar, .stackbar, .steps span, .hb .tr { border-radius: var(--r-p); overflow: hidden; }
.gbar { border: 0; background: rgba(255,255,255,.25); }
.gbar i { background: #fff; }
.budget .bar, .stackbar { border: 0; background: var(--bg-3); }
.tbl-wrap { border: 1px solid var(--line); border-radius: var(--r-s); }
.tbl th { background: var(--bg-2); color: var(--muted); font-family: var(--f-body); font-weight: 650; text-transform: none; letter-spacing: 0; font-size: .78rem; }
.ctot div { border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surf); }
.ctot span { font-family: var(--f-body); font-weight: 600; text-transform: none; letter-spacing: 0; }
.tile { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surf); box-shadow: var(--sh-1); }
.tile .cnt { border-radius: var(--r-p); background: var(--verde); color: #fff; }
.tile .minus { border: 0; border-radius: 50%; }
.regbar { border: 1px solid var(--line); border-radius: var(--r-p); background: color-mix(in srgb, var(--surf) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.timeline i { border-radius: 5px; border-width: 1px; }
.foto { border: 1px solid var(--line); border-radius: var(--r-s); }
.foglio { border-radius: var(--r-s); }
.medal svg.mb { filter: drop-shadow(0 6px 10px rgba(20, 32, 25, .25)); }
.tick { background: transparent; border-left-color: var(--line); font-family: var(--f-body); font-weight: 650; text-transform: none; letter-spacing: 0; font-size: .7rem; }
.tick svg { border-radius: 50%; border-width: 1.5px; }
.sw span { border-radius: 50%; }

/* carte */
.ccwrap { border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; background: var(--surf); box-shadow: var(--sh-1); }
.ccard { background: linear-gradient(135deg, var(--bosco-2), var(--bosco)); --pat-col: #8fd391; --pat-op: .09; }
.ccard.bancomat { background: linear-gradient(135deg, #18818c, #0f5960); }
.ccard::after { opacity: .55; filter: blur(2px); }
.ccbud { border-radius: var(--r-p); border-width: 1px; font-family: var(--f-body); font-weight: 650; text-transform: none; }
.ccedit { border-radius: 50%; }
.cchold { border-top: 1px solid var(--line); }

/* la tessera digitale */
.tessera { border: 0; border-radius: 22px; color: #fff; min-height: 0; aspect-ratio: 1.586; max-width: 440px; width: 100%; padding: 20px 22px;
  background: radial-gradient(120% 140% at 0% 0%, #3db842 0%, #2a952d 38%, #17631c 100%);
  box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 22px 44px -24px rgba(10, 20, 14, .6), 0 6px 14px -8px rgba(0,0,0,.25); --pat-col: #0b3a10; --pat-op: .2; --pat-w: 58px; --pat-h: 35px; isolation: isolate; }
.tessera::after { content: ""; position: absolute; inset: -40% -60%; z-index: 0; pointer-events: none;
  background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.28) 47%, rgba(255,255,255,.05) 53%, transparent 60%); transform: translateX(-45%); animation: luce 2.2s cubic-bezier(.16, 1, .3, 1) .5s 1 both; }
@keyframes luce { from { transform: translateX(-45%); } to { transform: translateX(45%); } }
.tessera > * { position: relative; z-index: 1; }
.tessera .tw { width: 118px; height: 15px; fill: #fff; }
.tessera .tchi { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.tessera .tnome { font: 700 clamp(1.25rem, 5vw, 1.55rem)/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
.tessera .tmeta { font-size: .82rem; opacity: .9; margin-top: 6px; }
.tessera .tn { font: 700 1rem/1 var(--f-display); letter-spacing: .08em; }
.tessera .ttop { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.tessera .tanno { font: 700 .82rem/1 var(--f-body); background: rgba(0, 0, 0, .22); padding: 6px 10px; border-radius: var(--r-p); }
.tessera .av { width: 46px; height: 46px; box-shadow: 0 0 0 3px rgba(255,255,255,.75); }

/* caricamento */
.loading .om svg { fill: var(--verde); }

.gbtn { background: var(--surf) !important; color: var(--ink) !important; border: 1px solid var(--rule) !important; box-shadow: var(--sh-2) !important; min-height: 54px; font-size: 1.02rem; }
.gbtn svg { width: 22px; height: 22px; }
.gbtn:hover { background: var(--bg-2) !important; filter: none !important; }

.brand .logoapp { width: 172px; }
.brand .wm { gap: 4px; }
.brand .wm b { padding-left: 2px; }
@media (max-width: 360px) { .brand .logoapp { width: 150px; } }

/* pulsante che sembra un link (ordini) */
.lnk { background: none; border: 0; padding: 6px 0 2px; margin: 0; font: 600 .8rem/1.2 var(--f-body); color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.lnk:hover { color: var(--ink); }

/* avvisi: larghi quanto il testo (prima andavano a capo a metà schermo) */
.toast { width: max-content; }
.toast span { min-width: 0; }
.toast button { flex: none; white-space: nowrap; }

/* carte: PIN e archivio */
.pinin { -webkit-text-security: disc; letter-spacing: .2em; }
.pinbig { font: 700 2.8rem/1 var(--f-display); letter-spacing: .32em; text-align: center; padding: 22px 0 18px; font-variant-numeric: tabular-nums; }
.ccstat { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.ccstat > div { border: 1px solid var(--line); border-radius: var(--r-s, 10px); padding: 10px 12px; }
.ccstat b { display: block; font: 700 1.15rem/1.1 var(--f-display); }
.ccstat span { font-size: .78rem; color: var(--muted); }
.ccard.spenta { filter: grayscale(.85); opacity: .8; }

/* navigazione */
.hero.tap { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.hero.tap:active { transform: scale(.995); }
.toolcats { display: grid; gap: 14px; }
.toolcat h4 { margin: 0 0 8px; font: 650 .8rem/1.2 var(--f-body); color: var(--muted); letter-spacing: .02em; }
.budh { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; margin: 6px 0 0; }
.budh .sq { width: 14px; height: 14px; border-radius: 4px; flex: none; }

/* saluto: «Buongiorno Matteo,» più piccolo, «se fem?» grande */
.hello h1 .ciao { display: block; font-size: .7em; line-height: 1.12; margin-bottom: .1em; }

/* easter egg notturno */
#notte { position: fixed; inset: 0; z-index: 75; display: grid; place-items: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); background: radial-gradient(120% 90% at 50% 110%, #173b22 0%, #08140c 62%, #040a06 100%); animation: notteIn .35s ease both; overflow: hidden; }

/* ================= scritture ================= */
const chains = {};
function setSync() { const el = $("#sync"); if (el) el.hidden = !(S.pending || S.offline); }
async function dbCall(path, op, data) {
  if (!S.db) throw { code: "unavailable", message: "archivio non disponibile" };
  const ref = S.db.doc(path);
  const run = () => (op === "delete" ? ref.delete() : op === "update" ? ref.update(data) : ref.set(data));
  try { await run(); } catch (e) {
    if (e && e.code === "unavailable") { await new Promise((r) => setTimeout(r, 400 + Math.random() * 600)); await run(); } else throw e;
  }
}
function W(path, op, data, opts = {}) {
  S.pending++; setSync();
  const prev = chains[path] || Promise.resolve();
  const p = prev.catch(() => {}).then(() => dbCall(path, op, data));
  chains[path] = p;
  return p.catch((e) => { if (!opts.quiet) erroreScrittura(e); throw e; }).finally(() => { S.pending--; setSync(); });
}
const wSet = (p, d, o) => W(p, "set", d, o);
const wUpd = (p, d, o) => W(p, "update", d, o);
const wDel = (p, o) => W(p, "delete", null, o);
function erroreScrittura(e) {
  console.warn(e);
  const c = e && e.code;
  if (c === "invalid_argument" && WEB) toast("Non hai il permesso di salvare qui: se pensi sia un errore, parlane con il segretario.");
  else if (c === "invalid_argument" && !isAdmin()) toast("Questa operazione si fa dall'account del consiglio.");
  else if (c === "quota_exceeded") toast("L'archivio è pieno: elimina qualche voce vecchia e riprova.");
  else if (c === "resource_exhausted") toast("Troppe operazioni insieme: aspetta un attimo e riprova.");
  else toast("Non sono riuscito a salvare. Controlla la connessione e riprova.");
}

const NAV = { pila: [], scroll: {}, cur: location.hash || "#home" };

/* ultimo accesso: ognuno scrive il suo, lo legge solo il consiglio (vedi le regole di Firebase) */
let accessoScritto = 0;
function segnaAccesso() {
  if (!WEB || !ME() || S.adminMode || !S.db) return;
  const ora = Date.now(); if (ora - accessoScritto < 15 * 60e3) return; accessoScritto = ora;
  const id = ME();
  wSet("ultimoaccesso/" + id, { ultimo: ora }, { quiet: true }).then(
    /* l'ora non sta più nel profilo, che leggono tutti i soci: lì resta solo «è entrato» */
    () => S.db.doc("profili/" + id).get().then((p) => { if (!p.exists) return wSet("profili/" + id, { visto: true }, { quiet: true }); if ((p.data() || {}).visto !== true) return wUpd("profili/" + id, { visto: true }, { quiet: true }); }).catch(() => {}),
    /* se le regole nuove non ci sono ancora, si continua come prima */
    () => S.db.doc("profili/" + id).get().then((p) => (p.exists ? wUpd("profili/" + id, { visto: ora }, { quiet: true }) : wSet("profili/" + id, { visto: ora }, { quiet: true }))).catch(() => {}));
}
function ultimoAccesso(u) {
  const a = (S.ultimoaccesso[u] || {}).ultimo, v = (S.profili[u] || {}).visto;
  return Math.max(Number(a) || 0, typeof v === "number" ? v : 0) || null;
}
function quandoAccesso(ts) {
  const d = new Date(ts), n = giorniTra(isoOf(d), oggi()), min = Math.round((Date.now() - ts) / 60e3), ora = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (min < 2) return "adesso";
  if (min < 60) return `${min} minuti fa`;
  if (n === 0) return "oggi alle " + ora;
  if (n === 1) return "ieri alle " + ora;
  if (n < 7) return `${GIORNI[d.getDay()]} alle ${ora}`;
  return `il ${d.getDate()} ${MESI[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? " " + d.getFullYear() : ""}`;
}
function rigaAccesso(u) {
  const ts = ultimoAccesso(u);
  if (ts) return `Ultimo accesso ${quandoAccesso(ts)}`;
  return S.profili[u] && S.profili[u].visto ? "Entrato nell'app" : "Non ancora entrato";
}

const SCOPI = { sheets: "https://www.googleapis.com/auth/spreadsheets", gmail: "https://www.googleapis.com/auth/gmail.readonly", calendar: "https://www.googleapis.com/auth/calendar", drive: "https://www.googleapis.com/auth/drive" };
let fsdb = null;
const ritarda = (ms) => new Promise((r) => setTimeout(r, ms));
/* update di claude.ai = unione profonda: con Firestore si scrive campo per campo */
function campiUpdate(d) {
  const FP = firebase.firestore.FieldPath, out = [];
  const giu = (o, pre) => { for (const [k, v] of Object.entries(o)) { const p = [...pre, k]; if (v && typeof v === "object" && !Array.isArray(v)) { if (Object.keys(v).length) giu(v, p); } else out.push(new FP(...p), v === undefined ? null : v); } };

}

/* senza rete Firestore salva in locale e manda dopo: non aspettiamo il server per sempre */
function scrivi(p) { p.catch((e) => console.warn("scrittura rifiutata", e)); return Promise.race([p.catch((e) => { throw erroreFs(e); }), ritarda(2500).then(() => (navigator.onLine ? p.catch((e) => { throw erroreFs(e); }) : undefined))]); }

  return {
    id: ref.id, path: ref.path,
    get: () => ref.get(),
    set: (d) => scrivi(ref.set(d)),
    update: (d) => { const c = campiUpdate(d); return c.length ? scrivi(ref.update(...c)) : Promise.resolve(); },
    delete: () => scrivi(ref.delete()),
    onSnapshot: (ok, ko) => ref.onSnapshot(ok, ko),
    collection: (sub) => colW(ref.collection(sub)),
    /* numerazione delle ricevute: prenotazione con una transazione */
    acquire: ({ holder, ttlMs = 8000 }) => fsdb.runTransaction(async (tx) => {
      const s = await tx.get(ref); const l = s.exists ? (s.data() || {})._lease : null;
      if ((s.exists && (s.data() || {}).contributoId) || (l && l.until > Date.now() && l.holder !== holder)) return { acquired: false };
      tx.set(ref, { _lease: { holder, until: Date.now() + ttlMs } }, { merge: true }); return { acquired: true };
    }).catch(() => ({ acquired: false })),

}
function colW(q) {
  return {
    path: q.path,
    where: (...a) => colW(q.where(...a)), orderBy: (...a) => colW(q.orderBy(...a)), limit: (n) => colW(q.limit(n)),
    get: () => q.get(), onSnapshot: (ok, ko) => q.onSnapshot(ok, ko),

function vaiAGoogle(scopi = [], ritorno = location.hash || "#home", silenzioso = false) {
  const state = casuale(), nonce = casuale();

/* al ritorno da Google: l'indirizzo contiene #id_token=… */
async function ritornoDaGoogle() {

  if (!/[#&](id_token|access_token|error)=/.test(h)) return false;
  const q = new URLSearchParams(h.slice(1));
  let st = null; try { st = JSON.parse(localStorage.getItem(OAUTH_KEY) || "null"); localStorage.removeItem(OAUTH_KEY); } catch (e) {}
  history.replaceState(null, "", location.pathname + ((st && st.ritorno) || "#home"));
  S.route = parseHash();
  if (q.get("error")) { if (!(st && st.silenzioso)) S.ui.loginErr = q.get("error") === "access_denied" ? "" : "Google non ha completato l'accesso (" + q.get("error") + ")."; return true; }
  if (!st || st.state !== q.get("state") || Date.now() - st.at > 15 * 60000) { S.ui.loginErr = "L'accesso è scaduto: riprova."; return true; }
  const id = q.get("id_token"), at = q.get("access_token");
  if (at && st.scopi && st.scopi.length) salvaToken(at, [...new Set([...st.scopi, ...String(q.get("scope") || "").split(/\s+/).filter(Boolean)])], Number(q.get("expires_in")) || 3600);

  catch (e) { S.ui.loginErr = spiegaLogin(e); }

/* il permesso di Google dura un'ora: resta salvato anche chiudendo l'app, e quando scade si rinnova da solo con un passaggio veloce da Google */
function tokenValido(scope) {
  for (const st of [localStorage, sessionStorage]) { try { const t = JSON.parse(st.getItem(TOKEN_KEY) || "{}"); if (t.exp > Date.now() + 60000 && (t.scopi || []).includes(scope)) return t.token; } catch (e) {} }
  return null;
}
function salvaToken(token, scopi, durata = 3600) {
  try { localStorage.setItem(TOKEN_KEY, JSON.stringify({ token, scopi, exp: Date.now() + Math.min(durata, 3600) * 1000 - 5 * 60000 })); sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  try { localStorage.setItem(CONCESSI_KEY, JSON.stringify([...new Set([...concessiGoogle(), ...scopi])])); localStorage.removeItem(RINNOVO_KEY); } catch (e) {}
}
function dimenticaToken(tutto) {
  try { localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); if (tutto) { localStorage.removeItem(CONCESSI_KEY); localStorage.removeItem(RINNOVO_KEY); } } catch (e) {}
}
function concessiGoogle() { try { return JSON.parse(localStorage.getItem(CONCESSI_KEY) || "[]"); } catch (e) { return []; } }
/* se il permesso era già stato dato, va a prenderne uno nuovo senza chiedere (al massimo un tentativo ogni 5 minuti, così non gira a vuoto) */
function rinnovaGoogle(scope) {
  const c = concessiGoogle();
  if (!window.GOOGLE_CLIENT_ID || !c.includes(scope) || !firebase.auth().currentUser) return false;
  let ult = 0; try { ult = Number(localStorage.getItem(RINNOVO_KEY)) || 0; } catch (e) {}
  if (Date.now() - ult < 5 * 60000) return false;
  try { localStorage.setItem(RINNOVO_KEY, String(Date.now())); } catch (e) {}
  vaiAGoogle(c, location.hash || "#home", true); return true;
}

/* ---------- Google Sheets: stessi comandi del connettore, via API ---------- */
const SH = "https://sheets.googleapis.com/v4/spreadsheets/";
const rng = (r) => encodeURIComponent(r);
async function sheetsTool(tool, i) {
  const s = SCOPI.sheets;
  if (tool === "get_values") return gapi(`${SH}${i.spreadsheetId}/values/${rng(i.range)}`, {}, s);
  if (tool === "update_values" || tool === "update_formulas") return gapi(`${SH}${i.spreadsheetId}/values/${rng(i.range)}?valueInputOption=USER_ENTERED`, { method: "PUT", body: JSON.stringify({ range: i.range, values: i.values || i.formulas }) }, s);
  if (tool === "get_spreadsheet") return gapi(`${SH}${i.spreadsheetId}?fields=sheets.properties(sheetId,title)`, {}, s);
  if (tool === "insert_dimension") return gapi(`${SH}${i.spreadsheetId}:batchUpdate`, { method: "POST", body: JSON.stringify({ requests: [{ insertDimension: { range: { sheetId: i.sheetId, dimension: i.dimension, startIndex: i.startIndex, endIndex: i.endIndex }, inheritFromBefore: !!i.inheritFromBefore } }] }) }, s);

}
/* ---------- Gmail: elenco e lettura delle conversazioni, nello stesso formato del connettore ---------- */
const GM = "https://gmail.googleapis.com/gmail/v1/users/me/";
const b64txt = (s) => { try { return new TextDecoder().decode(b64Bytes(s)); } catch (e) { return ""; } };
const intest = (m, n) => (((m.payload || {}).headers || []).find((h) => h.name.toLowerCase() === n) || {}).value || "";

}
async function gmailTool(tool, i) {
  const s = SCOPI.gmail;
  if (tool === "search_threads") {
    const l = await gapi(`${GM}threads?maxResults=${i.pageSize || 25}&q=${encodeURIComponent(i.query || "")}`, {}, s);
    const threads = await Promise.all((l.threads || []).map(async (t) => {
      const d = await gapi(`${GM}threads/${t.id}?format=metadata&metadataHeaders=Subject&metadataHeaders=From`, {}, s);
      const ms = d.messages || []; return { id: t.id, messageCount: ms.length, messages: ms.slice(-1).map((m) => messaggio(m)) };
    }));
    return { threads };
  }
  if (tool === "get_thread") {
    const d = await gapi(`${GM}threads/${i.threadId}?format=full`, {}, s);
    const messages = [];
    for (const m of (d.messages || []).slice(-5)) {
      let testo = "", html = ""; const attachments = [];
      const giu = async (p) => {
        if (!p) return;
        const mime = (p.mimeType || "").toLowerCase();
        if (p.filename) {
          if (/calendar|pdf|^image\/|^text\//.test(mime) || /\.(ics|pdf|jpe?g|png)$/i.test(p.filename)) {
            if ((p.body || {}).size > 12e6) attachments.push({ filename: p.filename, mimeType: mime });
            else { const data = p.body.data || (p.body.attachmentId ? (await gapi(`${GM}messages/${m.id}/attachments/${p.body.attachmentId}`, {}, s)).data : null); attachments.push({ filename: p.filename, mimeType: mime, content: data }); }
          } else attachments.push({ filename: p.filename, mimeType: mime });
        } else if (mime === "text/plain" && p.body && p.body.data) testo += b64txt(p.body.data) + "\n";
        else if (mime === "text/html" && p.body && p.body.data) html += b64txt(p.body.data);
        else if (/calendar/.test(mime) && p.body && p.body.data) attachments.push({ filename: "invito.ics", mimeType: mime, content: p.body.data });
        for (const q of p.parts || []) await giu(q);
      };
      await giu(m.payload);
      if (!testo && html) testo = html.replace(/<style[\s\S]*?<\/style>/gi, "").replace(/<br\s*\/?>|<\/p>|<\/div>/gi, "\n").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"');

const mcpWeb = { async callTool(server, tool, input) { return { payload: server === "Gmail" ? await gmailTool(tool, input) : await sheetsTool(tool, input) }; } };

/* ---------- appuntamenti dalle mail senza Claude: data e ora cercate nel testo ---------- */
function senzaClaude(testo, oggetto, dataRif) {
  const t = String(testo || "").replace(/\s+/g, " ");
  const mesi = MESI.join("|");
  const rif = dOf(dataRif) || new Date();
  const futuro = (g, m, a) => { let y = a ? (String(a).length === 2 ? 2000 + Number(a) : Number(a)) : rif.getFullYear(); let d = new Date(y, m, g); if (!a && d < rif) d = new Date(y + 1, m, g); return d.getMonth() === m ? isoOf(d) : null; };
  let data = null, idx = -1, m;
  const r1 = new RegExp(`\\b(\\d{1,2})\\s+(${mesi})(?:\\s+(\\d{4}))?`, "i");
  if ((m = r1.exec(t))) { data = futuro(Number(m[1]), MESI.indexOf(m[2].toLowerCase()), m[3]); idx = m.index; }
  if (!data && (m = /\b(\d{1,2})[/.](\d{1,2})(?:[/.](\d{2,4}))?\b/.exec(t))) { data = futuro(Number(m[1]), Number(m[2]) - 1, m[3]); idx = m.index; }
  let ora = null;
  const vicino = idx >= 0 ? t.slice(idx, idx + 140) : t;
  if ((m = /\b(?:alle|ore|h\.?|dalle)\s*(\d{1,2})(?:[:.](\d{2}))?/i.exec(vicino))) { const h = Number(m[1]); if (h < 24) ora = pad(h) + ":" + (m[2] || "00"); }
  return { tipo: "appuntamento", titolo: String(oggetto || t.slice(0, 60) || "Appuntamento").replace(/^(re|fwd?|i|r):\s*/i, "").slice(0, 90), data, ora, fine: null, dataFine: null, luogo: null, cosa: t.slice(0, 400), certezza: "bassa", manuale: true };
}

/* scrive un movimento in fondo al registro dell'anno (stessa logica della dashboard Finanze) */
async function scriviMovimento(anno, { tipo, conto, importo, data, desc, codice, tag, anticipo }) {
  const sid = registri()[anno]; if (!sid) throw { message: "Non c'è un registro per il " + anno + ": aggiungilo nelle impostazioni delle Finanze." };
  const mcp = await mcpPronto();
  const letto = await mcp.callTool(SHEETS, "get_values", { spreadsheetId: sid, range: `'${FOGLIO}'!A1:L1200` }, { cache: false });
  const righe = (letto.payload && letto.payload.values) || [];
  const t = (r, c) => String((r && r[c]) ?? "").trim();
  const totali = righe.findIndex((r) => t(r, 0).toUpperCase() === "TOTALI");
  if (totali < 0) throw { message: "non trovo la riga TOTALI nel registro " + anno };
  let ultima = -1, maxN = 0;
  for (let i = 0; i < totali; i++) { const v = t(righe[i], 0); if (/^\d+$/.test(v)) { ultima = i; maxN = Math.max(maxN, Number(v)); } }
  if (ultima < 0) ultima = righe.findIndex((r) => t(r, 0).startsWith("N."));
  if (ultima < 0) throw { message: "non trovo l'intestazione del registro " + anno };
  let target = ultima + 1;
  if (target < totali && (righe[target] || []).some((c) => String(c ?? "").trim())) throw { message: "la riga " + (target + 1) + " sotto l'ultimo movimento non è vuota: controlla il foglio" };
  if (target >= totali) {
    const info = await mcp.callTool(SHEETS, "get_spreadsheet", { spreadsheetId: sid, fields: ["sheets.properties.sheetId", "sheets.properties.title"] }, { cache: false });
    const foglio = ((info.payload && info.payload.sheets) || []).find((s) => s.properties && s.properties.title === FOGLIO);
    if (!foglio) throw { message: "non trovo il foglio «" + FOGLIO + "»" };
    await mcp.callTool(SHEETS, "insert_dimension", { spreadsheetId: sid, sheetId: foglio.properties.sheetId, dimension: "ROWS", startIndex: totali, endIndex: totali + 10, inheritFromBefore: true });
    const rTot = totali + 11;
    await mcp.callTool(SHEETS, "update_formulas", { spreadsheetId: sid, range: `'${FOGLIO}'!F${rTot}:I${rTot}`, formulas: [["F", "G", "H", "I"].map((c) => `=SUM(${c}8:${c}${rTot - 1})`)] });
    target = totali;
  }
  const riga = target + 1, n = maxN + 1;
  const valori = [n, seriale(data), desc, codice, tag,
    tipo === "E" && conto === "cassa" ? importo : null, tipo === "U" && conto === "cassa" ? importo : null,
    tipo === "E" && conto === "cc" ? importo : null, tipo === "U" && conto === "cc" ? importo : null,
    anticipo || null, anticipo ? true : null, null];
  await mcp.callTool(SHEETS, "update_values", { spreadsheetId: sid, range: `'${FOGLIO}'!A${riga}:L${riga}`, values: [valori] });
  delete cache[anno];
  return { anno, n, riga };
}

function filtroEv(e, f) {

  if (f === "tutti") return true;
  if (f === "miei") return e.tipo === "appuntamento" ? true : (e.tipo !== "incontro" || inGroup(e.gruppo) || e.creatoDa === ME() || e.aperto || rsvp(e) || invitato(e));
  if (f === "generali") return e.tipo === "evento" || e.tipo === "riunione";
  if (f === "progetti") return !!e.progetto;
  if (f === "consiglio") return (e.tipo === "incontro" && e.gruppo === "consiglio") || (e.tipo === "appuntamento" && e.visib === "consiglio");
  return e.tipo === "incontro" && e.gruppo === f;
}

/* il mese: ogni appuntamento è una striscia colorata col titolo, quelli di più giorni continuano da un giorno all'altro */
function meseHtml(tutti, mese, sel) {
  const [y, m] = mese.split("-").map(Number);
  const primo = new Date(y, m - 1, 1); const off = (primo.getDay() + 6) % 7;
  const giorni = []; for (let i = -off; i < 42 - off; i++) giorni.push(isoOf(new Date(y, m - 1, 1 + i)));
  const settimane = []; for (let w = 0; w < 6; w++) { const g = giorni.slice(w * 7, w * 7 + 7); if (w > 3 && dOf(g[0]).getMonth() !== m - 1) break; settimane.push(g); }
  const MAX = 3;
  const html = settimane.map((sett) => {
    const a = sett[0], b = sett[6];
    const evs = tutti.filter((e) => e.data <= b && (e.dataFine || e.data) >= a)
      .sort((x, z) => ((z.dataFine || z.data) > z.data) - ((x.dataFine || x.data) > x.data) || x.data.localeCompare(z.data) || (x.ora || "99").localeCompare(z.ora || "99"));
    const slot = []; // slot[i] = array di 7 posti
    const pos = new Map();
    for (const e of evs) {
      const i0 = Math.max(0, sett.indexOf(e.data < a ? a : e.data)), i1 = Math.min(6, sett.indexOf((e.dataFine || e.data) > b ? b : (e.dataFine || e.data)));
      let k = 0; while (slot[k] && slot[k].slice(i0, i1 + 1).some(Boolean)) k++;
      slot[k] = slot[k] || Array(7).fill(null);
      for (let i = i0; i <= i1; i++) slot[k][i] = e;
      pos.set(e, k);
    }
    return sett.map((d, i) => {
      const nGiorno = evs.filter((e) => e.data <= d && (e.dataFine || e.data) >= d);
      const righe = [];
      for (let k = 0; k < Math.min(slot.length, MAX); k++) {
        const e = slot[k][i];
        if (!e) { righe.push(`<span class="ce vuoto"></span>`); continue; }
        const c = colEv(e); const ini = e.data === d || i === 0, fin = (e.dataFine || e.data) === d || i === 6;
        righe.push(`<span class="ce ${ini ? "s" : ""} ${fin ? "e" : ""} ${e.personale ? "pers" : ""}" style="background:${c.bg};color:${c.fg}">${ini ? esc((e.pagamento ? "€ " : e.ora && !e.dataFine ? "" : "") + e.titolo) : "&nbsp;"}</span>`);
      }
      while (righe.length && righe[righe.length - 1].includes("vuoto")) righe.pop();
      const nascosti = nGiorno.filter((e) => pos.get(e) >= MAX).length;
      return `<button class="d ${d.slice(0, 7) !== mese ? "out" : ""} ${d === oggi() ? "oggi" : ""}" data-act="cal-giorno" data-d="${d}" aria-pressed="${d === sel}" aria-label="${esc(fDataL(d))}, ${nGiorno.length ? nGiorno.length + " appuntamenti: " + esc(nGiorno.map((e) => e.titolo).join(", ")) : "niente"}"><span class="n">${dOf(d).getDate()}</span><span class="evs" aria-hidden="true">${righe.join("")}${nascosti ? `<span class="piu">+${nascosti}</span>` : ""}</span></button>`;
    }).join("");
  }).join("");
  const visti = new Map();
  tutti.filter((e) => e.data <= settimane[settimane.length - 1][6] && (e.dataFine || e.data) >= settimane[0][0]).forEach((e) => { const c = colEv(e); if (!visti.has(c.k)) visti.set(c.k, c); });
  const leg = [...visti.values()];
  return `<div class="cal"><div class="cg">${["lun", "mar", "mer", "gio", "ven", "sab", "dom"].map((g) => `<div class="dow">${g}</div>`).join("")}${html}</div></div>
    ${leg.length ? `<div class="calleg" aria-label="Legenda dei colori">${leg.map((c) => `<span><i style="background:${c.bg}"></i>${esc(c.l)}</span>`).join("")}</div>` : ""}`;
}

function leggiDate(txt, anno) {
  const out = [];
  for (const r of String(txt || "").split(/[\n,;]+/).map((x) => x.trim()).filter(Boolean)) {
    let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(r); if (m) { out.push(r); continue; }
    m = /^(\d{1,2})[/.-](\d{1,2})(?:[/.-](\d{2,4}))?$/.exec(r);
    if (m) { const y = m[3] ? (m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3])) : anno; const d = new Date(y, Number(m[2]) - 1, Number(m[1])); if (d.getMonth() === Number(m[2]) - 1) out.push(isoOf(d)); else return null; } else return null;
  }

/* l'immagine diventa un PNG quadrato da 320 px, intera e centrata */
function preparaMedaglia(file) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const L = 320, cv = document.createElement("canvas"); cv.width = cv.height = L;
        const w = img.naturalWidth || L, h = img.naturalHeight || L, k = Math.min(L / w, L / h);
        cv.getContext("2d").drawImage(img, (L - w * k) / 2, (L - h * k) / 2, w * k, h * k);
        let out = cv.toDataURL("image/png");
        if (out.length > 350000) { const w2 = cv.toDataURL("image/webp", 0.9); out = w2.startsWith("data:image/webp") && w2.length < out.length ? w2 : out; }
        if (out.length > 350000) { const c2 = document.createElement("canvas"); c2.width = c2.height = 240; c2.getContext("2d").drawImage(cv, 0, 0, 240, 240); out = c2.toDataURL("image/png"); }
        URL.revokeObjectURL(url);
        out.length > 700000 ? ko(new Error("troppo grande")) : ok(out);
      } catch (e) { URL.revokeObjectURL(url); ko(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error("immagine non valida")); };
    img.src = url;
  });
}

    clearInterval(S._cdT);

      const el = document.querySelector("[data-cd]"); if (!el) return clearInterval(S._cdT);

    }, 1000);
  } };
});

route("budget", () => {
  const anno = String(new Date().getFullYear());

  if (!gs.length) return `<div class="wrap">${backLink("strumenti", "Strumenti")}${empty("Budget dei gruppi", "Li vedono il consiglio e i gruppi che hanno un budget.")}</div>`;
  return `<div class="wrap">${backLink("strumenti", "Strumenti")}
    <div class="pagehead"><div class="stack"><span class="eyebrow">Quanto può spendere ogni gruppo nel ${anno}</span><h1>Budget</h1></div></div>
    ${isCouncil() ? `<div class="notice small">Il consiglio fissa il budget dell'anno con «Imposta» (o «Cambia»). Le spese si scalano da sole: quelle fatte con le carte, quelle segnate qui e i rimborsi approvati. I soldi caricati sulle prepagate si dividono tra i budget da <a href="#carte">Carte → Ricarica</a>.</div>` : ""}
    ${gs.map((k) => `<div class="stack s"><h2 class="budh"><i class="sq" style="background:${colBudget(k)}"></i>${esc(GRUPPI[k].nome)}</h2>${bloccoBudget(k)}</div>`).join("")}
  </div>`;
});
function speseGruppo(k, anno = String(new Date().getFullYear())) {
  const carte = speseCarte().filter((m) => m.budget === k).map((m) => ({ id: "c-" + m.id, importo: m.importo, desc: m.desc, data: m.data, da: m.chi, carta: m.carta }));
  return [...Object.entries((S.budget[k] || {}).spese || {}).map(([id, s]) => ({ id, ...s })), ...carte].filter((s) => (s.data || "").startsWith(anno)).sort((a, b) => (b.data || "").localeCompare(a.data || ""));
}
function bloccoBudget(k) {
  const anno = String(new Date().getFullYear());
  const b = S.budget[k] || {};
  const tot = Number((b.importi || {})[anno]) || 0;
  const spese = speseGruppo(k, anno);
  const speso = spese.reduce((s, x) => s + (Number(x.importo) || 0), 0);
  const pct = tot ? Math.min(100, (speso / tot) * 100) : 0;
  const puo = inGroup(k) || isCouncil();
  return `<section class="panel budget"><div class="ph"><h3>Budget ${anno}</h3>${isCouncil() ? `<button class="btn sm" data-act="budget-imposta" data-g="${k}">${ic("edit")}${tot ? "Cambia" : "Imposta"}</button>` : ""}</div>
    <div class="pb"><div class="row between"><span><span class="big" style="font-size:2rem">${esc(euroT(tot - speso))}</span><br><span class="small muted">rimasti su ${esc(euroT(tot))}</span></span><span class="v" style="font:700 1.1rem var(--f-display)">${esc(euroT(speso))}<br><span class="small muted">spesi</span></span></div>
      ${tot ? `<div class="bar" role="img" aria-label="Speso ${Math.round(pct)}%"><i class="${speso > tot ? "over" : ""}" style="width:${pct}%"></i></div>` : `<p class="small muted">Il consiglio non ha ancora fissato il budget di quest'anno.</p>`}
      ${cassaCarte().per[k] && cassaCarte().per[k].caricato ? `<a class="notice small" href="#carte" style="text-decoration:none;color:inherit">${ic("card")} Sulle prepagate restano <b>${esc(euro(residuo(k)))}</b> per ${esc(GRUPPI[k].nome)}.</a>` : ""}
      ${puo ? `<div class="btns">${carteAttive().length ? `<button class="btn sm pri" data-act="cspesa-nuova" data-carta="${(carteAttive().find((c) => c.budget === k) || carteAttive()[0]).id}">${ic("card")}Spesa con la carta</button>` : ""}<button class="btn sm" data-act="spesa-nuova" data-g="${k}">${ic("plus")}Segna una spesa</button><button class="btn sm ghost" data-act="nuovo-anticipo" data-g="${k}">Ho pagato io: chiedi il rimborso</button></div>` : ""}</div>
    ${spese.length ? `<div class="list" style="border-top:2px solid var(--rule)">${spese.slice(0, 12).map((s) => `<div class="li"><span class="grow"><span class="t">${esc(s.desc)}</span><br><span class="s">${esc(fData(s.data))} · ${s.anticipo ? "anticipata da " + esc(primoNome(s.da)) : s.carta ? `${esc(primoNome(s.da))} con la ${esc(nomeCarta(s.carta))}` : "pagata dall'associazione"}</span></span><span class="v">${esc(euro(s.importo))}</span>${isCouncil() && !s.anticipo && !s.carta ? `<button class="btn sm ghost" data-act="spesa-del" data-g="${k}" data-id="${s.id}" aria-label="Elimina spesa">${ic("trash")}</button>` : ""}</div>`).join("")}</div>` : ""}
  </section>`;
}

function comprimiFoto(file) {
  return new Promise((ok, ko) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      let w = img.width, h = img.height; const max = 1100; if (Math.max(w, h) > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h);
      let q = .72, out = cv.toDataURL("image/jpeg", q); while (out.length > 190000 && q > .3) { q -= .1; out = cv.toDataURL("image/jpeg", q); }
      ok(out); }; img.onerror = ko; img.src = r.result; };
    r.onerror = ko; r.readAsDataURL(file);
  });
}

  if (normNome(nome).split(" ").length < 2) return fErr(f, "Scrivi nome e cognome.");
  if (WEB && !email) return fErr(f, `Serve la mail @${DOMINIO()}: è quella con cui entra.`);
  if (email && !emailValida(email)) return fErr(f, `La mail deve essere quella associativa @${DOMINIO()}.${WEB ? "" : " Se non ce l'ha, lascia vuoto."}`);
  if (WEB && esiste && slugEmail(email) !== old) return fErr(f, "Con l'accesso Google la mail non si può cambiare: disattiva questo socio e aggiungilo di nuovo con la mail giusta.");
  const doppio = email && socioDaEmail(email); if (doppio && doppio[0] !== old) return fErr(f, `${email} è già di ${doppio[1].nome}.`);
  const omonimo = sociDaNome(nome).find(([x]) => x !== old); if (omonimo) return fErr(f, `C'è già un socio che si chiama ${nome}: aggiungi un secondo nome o l'iniziale per distinguerli.`);
  let id = esiste ? old : (email ? slugEmail(email) : slugNome(nome));
  if (!esiste && S.soci[id]) id = id + "-" + Math.random().toString(36).slice(2, 5);
  const vecchio = ruolo && Object.keys(S.soci).find((x) => x !== id && S.soci[x].ruolo === ruolo);
  const d = { ...(esiste ? strip(S.soci[id]) : { dal: oggi() }), nome, email, ruolo, gruppi: fvAll(f, "g"), attivo: esiste ? fv(f, "attivo") : true, agg: Date.now() };
  await wSet("soci/" + id, d);
  if (tel || (S.contatti[id] || {}).telefono) await wSet("contatti/" + id, { telefono: tel }, { quiet: true }).catch(() => {});
  if (vecchio) await wUpd("soci/" + vecchio, { ruolo: null });
  if (old && S.richieste[old]) await wDel("richieste/" + old, { quiet: true }).catch(() => {});
  closeSheet(); toast(`${nome}: salvato.`);
  if (!esiste && WEB) toast(`${nome}: aggiunto. Può entrare da bagaera.it/app con «Accedi con Google».`);
  else if (!esiste) { S.soci[id] = { id, ...d }; if (tel) S.contatti[id] = { telefono: tel }; email ? nuovoInvito(id) : nuovoPin(id); }

const movCarta = (cid) => [...Object.values(S.cartemov).map((m) => ({ ...m, _c: "mov" })), ...Object.values(S.carteric).map((m) => ({ ...m, _c: "ric" }))].filter((m) => m.carta === cid)
